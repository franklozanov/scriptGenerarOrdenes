<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Entrega / Novedad</title>
  
  <!-- FASE 6: Design System Centralizado -->
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  
  <style>
    /* Estilos específicos de este modal */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer" style="display: none;">
    <div class="info">
      Seleccione una orden, el tipo de novedad y el nuevo estado. El sistema actualizará automáticamente el STATUS de la orden y dejará un registro en el historial.
    </div>

    <form id="novedadForm">
      <div class="form-row">
        <div class="form-group">
          <label for="usuarioResponsable">Usuario Responsable</label>
          <input type="text" id="usuarioResponsable" list="usuariosList" placeholder="Seleccione usuario" required>
          <datalist id="usuariosList"></datalist>
        </div>
        <div class="form-group">
          <label for="noOrden">Número de Orden</label>
          <select id="noOrden" required>
            <option value="">Cargando órdenes...</option>
          </select>
          <input type="hidden" id="ordenCodigo">
          <input type="hidden" id="ordenTotalPags">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="nuevoStatus">Nuevo Estado (STATUS)</label>
          <select id="nuevoStatus" required>
            <option value="">Seleccione estado</option>
            <option value="RecibidaQA">RecibidaQA</option>
            <option value="DevueltaQA">DevueltaQA</option>
            <option value="Cerrada">Cerrada</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tipoNovedad">Tipo de Novedad</label>
          <select id="tipoNovedad" required>
            <option value="">Seleccione tipo</option>
            <option value="Entrega de orden de acondicionamiento">Entrega de orden de acondicionamiento</option>
            <option value="Devolución de orden de acondicionamiento">Devolución de orden de acondicionamiento</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="totalPagsMostrado">Páginas Entregadas</label>
          <input type="number" id="totalPagsMostrado" readonly style="background-color: #f5f5f5;" placeholder="-">
        </div>
        <div class="form-group">
          <label for="noPagDevueltas">Páginas Devueltas</label>
          <input type="number" id="noPagDevueltas" min="0" placeholder="0">
        </div>
      </div>

      <div id="paginasWarning" style="display: none; color: #e65100; font-size: 12px; margin-bottom: 16px; margin-top: -8px; background-color: #fff3e0; padding: 8px; border-radius: 4px; border-left: 3px solid #ffb74d;">
        ⚠️ <strong>Atención:</strong> Las páginas devueltas no coinciden con las entregadas. Es <strong>obligatorio</strong> registrar el motivo en el comentario.
      </div>

      <div class="form-group">
        <label for="comentario">Comentario <span id="reqAsterisk" style="color: red; display: none;">*</span></label>
        <textarea id="comentario" placeholder="Ingrese comentarios adicionales (opcional)"></textarea>
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary" id="btnSubmit">Registrar Novedad</button>
        <button type="button" class="btn btn-secondary" id="btnCancel">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Procesando...</div>
  </div>

  <!-- FASE 6: JavaScript Compartido -->
  <?!= HtmlService.createHtmlOutputFromFile('GlobalScripts').getContent(); ?>

  <script>
    var globalWebAppUrl = '';
    var users = [];
    var ordenes = [];

    function initialize() {
      google.script.run
        .withSuccessHandler(function(data) {
          if (data && data.webAppUrl) {
            globalWebAppUrl = data.webAppUrl;
          }
          if (data && data.users) {
            users = data.users;
            
            if (users.length === 0) {
              hideLoading();
              showError('No hay usuarios configurados en la hoja Usuarios.');
              return;
            }

            function onUserValidated(userObj) {
              window.currentUserIdentity = userObj.userId + " - " + userObj.nombreCompleto;
              window.currentUserIdentityObj = userObj;
              
              var inputUsuario = document.getElementById('usuarioResponsable');
              var userContainer = inputUsuario.parentElement;
              userContainer.innerHTML = '<label>Usuario Responsable</label>' +
                '<div style="padding: 8px 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; color: #166534; font-weight: 500; font-size: 0.9em; display: flex; align-items: center; gap: 8px;">' +
                '<span style="font-size: 1.2em;">👤</span>' +
                '<span>Ingresaste como: <strong>' + userObj.nombreCompleto + '</strong></span>' +
                '</div>';
              
              if (typeof Swal !== 'undefined') {
                Swal.fire({
                  toast: true, position: 'top-end', icon: 'success',
                  title: 'Usuario validado', text: 'Bienvenido, ' + userObj.nombreCompleto,
                  showConfirmButton: false, timer: 3000, timerProgressBar: true
                });
              }
              loadOrdenes();
            }

            var myEmail = data.activeEmail ? data.activeEmail.toLowerCase().trim() : "";
            var matchedUsers = users.filter(function(u) { return u.email && u.email.toLowerCase().trim() === myEmail; });

            if (matchedUsers.length === 1) {
              onUserValidated(matchedUsers[0]);
            } else if (matchedUsers.length > 1) {
              var optionsHtml = matchedUsers.map(function(u, idx) { return '<option value="' + idx + '">' + u.nombreCompleto + ' (' + u.rol + ')</option>'; }).join('');
              var overlay = document.getElementById('loading-overlay');
              overlay.classList.remove('hidden');
              overlay.innerHTML = 
                '<div style="background:white; border-radius:12px; padding:28px 24px; max-width:360px; width:90%; box-shadow:0 4px 24px rgba(0,0,0,0.12); text-align:center; font-family:\'Inter\',sans-serif; color:#0f172a;">' +
                  '<div style="font-size:2rem; margin-bottom:12px;">👥</div>' +
                  '<h3 style="margin:0 0 8px 0; font-size:1rem;">Selecciona tu perfil</h3>' +
                  '<p style="margin:0 0 16px 0; color:#64748b; font-size:0.85rem;">Tu correo tiene múltiples perfiles. ¿Con cuál deseas ingresar?</p>' +
                  '<select id="profileSelect" style="width:100%; padding:9px 12px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:0.9rem; margin-bottom:16px; background:white; color:#0f172a;">' + optionsHtml + '</select>' +
                  '<button id="profileConfirmBtn" style="width:100%; padding:10px; background:#1976d2; color:white; border:none; border-radius:8px; font-size:0.9rem; font-weight:600; cursor:pointer;">Ingresar</button>' +
                '</div>';
              
              document.getElementById('profileConfirmBtn').addEventListener('click', function() {
                var idx = document.getElementById('profileSelect').value;
                overlay.innerHTML = '<div class="spinner"></div><div class="loading-text" id="loading-text">Cargando datos...</div>';
                onUserValidated(matchedUsers[idx]);
              });
              return;
            } else {
               document.body.innerHTML = 
                 '<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: \'Inter\', sans-serif; background-color: #f8fafc; padding: 20px; text-align: center;">' +
                   '<div style="font-size: 48px; margin-bottom: 16px;">🚫</div>' +
                   '<h2 style="color: #0f172a; margin: 0 0 12px 0;">Acceso Denegado</h2>' +
                   '<p style="color: #475569; margin: 0 0 24px 0; max-width: 400px; line-height: 1.5;">El correo <strong>' + (myEmail || 'Desconocido') + '</strong> no tiene un usuario asignado en el sistema.</p>' +
                   '<div style="background: #e2e8f0; padding: 16px; border-radius: 8px; color: #334155; font-size: 0.9em; border-left: 4px solid #94a3b8;">Por favor, solicita al administrador que cree tu usuario en la hoja de <strong>Usuarios</strong>.</div>' +
                 '</div>';
               return;
            }
          } else {
            loadOrdenes();
          }
        })
        .withFailureHandler(function(error) {
          showError('Error al cargar datos iniciales: ' + error.message);
          hideLoading();
          document.getElementById('mainContainer').style.display = 'block';
        })
        .getInitialData();

      document.getElementById('btnCancel').addEventListener('click', function() {
        google.script.host.close();
      });

      document.getElementById('novedadForm').addEventListener('submit', handleSubmit);
      document.getElementById('noOrden').addEventListener('change', handleOrdenChange);
      document.getElementById('noPagDevueltas').addEventListener('input', validarPaginas);
    }

    function populateUsuariosList() {
      var datalist = document.getElementById('usuariosList');
      datalist.innerHTML = '';
      users.forEach(function(user) {
        var option = document.createElement('option');
        option.value = user.nombreCompleto;
        option.setAttribute('data-userid', user.userId);
        datalist.appendChild(option);
      });
    }

    function loadOrdenes() {
      google.script.run
        .withSuccessHandler(function(data) {
          ordenes = data || [];
          populateOrdenesSelect();
          // Finaliza la carga completa
          hideLoading();
          document.getElementById('mainContainer').style.display = 'block';
        })
        .withFailureHandler(function(error) {
          showError('Error al cargar órdenes: ' + error.message);
          document.getElementById('noOrden').innerHTML = '<option value="">Error al cargar</option>';
          hideLoading();
          document.getElementById('mainContainer').style.display = 'block';
        })
        .getOrdenesParaNovedad();
    }

    function populateOrdenesSelect() {
      var select = document.getElementById('noOrden');
      select.innerHTML = '<option value="">Seleccione orden</option>';
      
      ordenes.forEach(function(orden) {
        var option = document.createElement('option');
        option.value = orden.noOrden;
        option.textContent = orden.noOrden + ' - ' + orden.codigo;
        option.setAttribute('data-codigo', orden.codigo);
        option.setAttribute('data-totalpags', orden.totalPags);
        select.appendChild(option);
      });
    }

    function handleOrdenChange() {
      var select = document.getElementById('noOrden');
      var selectedOption = select.options[select.selectedIndex];
      
      if (selectedOption && selectedOption.value !== "") {
        document.getElementById('ordenCodigo').value = selectedOption.getAttribute('data-codigo') || '';
        var totalPags = selectedOption.getAttribute('data-totalpags') || '0';
        document.getElementById('ordenTotalPags').value = totalPags;
        document.getElementById('totalPagsMostrado').value = totalPags;
      } else {
        document.getElementById('ordenCodigo').value = '';
        document.getElementById('ordenTotalPags').value = '0';
        document.getElementById('totalPagsMostrado').value = '';
      }
      validarPaginas();
    }

    function validarPaginas() {
      var totalPags = document.getElementById('totalPagsMostrado').value;
      var devueltas = document.getElementById('noPagDevueltas').value;
      var warning = document.getElementById('paginasWarning');
      var comentario = document.getElementById('comentario');
      var reqAsterisk = document.getElementById('reqAsterisk');
      var noOrden = document.getElementById('noOrden').value;
      
      if (!noOrden || totalPags === "") {
        warning.style.display = 'none';
        comentario.required = false;
        reqAsterisk.style.display = 'none';
        return;
      }
      
      var numTotal = Number(totalPags) || 0;
      var numDevueltas = devueltas === "" ? -1 : Number(devueltas);
      
      if (numDevueltas >= 0 && numTotal !== numDevueltas) {
        warning.style.display = 'block';
        comentario.required = true;
        reqAsterisk.style.display = 'inline';
        comentario.placeholder = "Ingrese el motivo de la diferencia de páginas (Obligatorio)";
      } else {
        warning.style.display = 'none';
        comentario.required = false;
        reqAsterisk.style.display = 'none';
        comentario.placeholder = "Ingrese comentarios adicionales (opcional)";
      }
    }

    function handleSubmit(e) {
      e.preventDefault();
      
      var usuarioUserId = "";
      
      if (window.currentUserIdentityObj) {
        usuarioUserId = window.currentUserIdentityObj.userId;
      } else {
        var inputUsuario = document.getElementById('usuarioResponsable') ? document.getElementById('usuarioResponsable').value.trim() : "";
        for (var i = 0; i < users.length; i++) {
          if (users[i].nombreCompleto === inputUsuario) {
            usuarioUserId = users[i].userId;
            break;
          }
        }
      }

      var noOrden = document.getElementById('noOrden').value;
      var codigo = document.getElementById('ordenCodigo').value;
      var totalPags = document.getElementById('ordenTotalPags').value;
      var nuevoStatus = document.getElementById('nuevoStatus').value;
      var tipoNovedad = document.getElementById('tipoNovedad').value;
      var noPagDevueltas = document.getElementById('noPagDevueltas').value;
      var comentario = document.getElementById('comentario').value;

      if (!usuarioUserId) {
        showError('Seleccione un usuario válido de la lista.');
        return;
      }

      if (!noOrden || !codigo) {
        showError('Seleccione una orden válida.');
        return;
      }

      if (!nuevoStatus) {
        showError('Seleccione el nuevo estado.');
        return;
      }

      if (!tipoNovedad) {
        showError('Seleccione el tipo de novedad.');
        return;
      }

      var numTotal = Number(totalPags) || 0;
      var numDevueltas = noPagDevueltas === "" ? -1 : Number(noPagDevueltas);
      
      if (numDevueltas >= 0 && numTotal !== numDevueltas && !comentario.trim()) {
        showAlert('Las páginas devueltas no coinciden con las entregadas. Debe registrar el motivo en los comentarios.', 'warning');
        document.getElementById('comentario').focus();
        return;
      }

      var params = {
        operation: 'registrarNovedad',
        userId: usuarioUserId,
        noOrden: noOrden,
        codigo: codigo,
        tipoNovedad: tipoNovedad,
        status: nuevoStatus,
        comentario: comentario,
        totalPags: Number(totalPags) || 0,
        noPagDevueltas: Number(noPagDevueltas) || 0,
        realizadoPor: usuarioUserId
      };

      showLoading('Registrando novedad...');

      fetch(globalWebAppUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain'
        },
        body: JSON.stringify(params)
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(result) {
        hideLoading();
        if (result.status === 'success') {
          showAlert('Novedad registrada exitosamente. Puede registrar otra novedad.', 'success');
          resetearCamposNovedad();
        } else {
          showError('Error al registrar novedad: ' + (result.message || 'Error desconocido'));
        }
      })
      .catch(function(error) {
        hideLoading();
        showError('Error al registrar novedad: ' + error.message);
      });
    }

    function resetearCamposNovedad() {
      document.getElementById('noOrden').value = '';
      document.getElementById('nuevoStatus').value = '';
      document.getElementById('tipoNovedad').value = '';
      document.getElementById('noPagDevueltas').value = '';
      document.getElementById('comentario').value = '';
      
      document.getElementById('ordenCodigo').value = '';
      document.getElementById('ordenTotalPags').value = '0';
      document.getElementById('totalPagsMostrado').value = '';
      
      validarPaginas();
      loadOrdenes();
    }

    // Funciones showLoading y showMessage ahora vienen de GlobalScripts.html

    // Inicializar al cargar
    window.addEventListener('load', function() {
      initialize();
      
      // Inicializar drag y resize (el drag handle azul está oculto en Theme.html)
      initializeModalDragResize({
        title: 'Registrar Entrega / Novedad',  // No se mostrará - drag handle oculto
        enableDrag: true,
        enableResize: true,
        minWidth: 500,
        minHeight: 600,
        maxWidth: 900,
        maxHeight: 900
      });
    });
  </script>
</body>
</html>
