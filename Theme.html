<!-- ============================================================
     THEME.HTML - Sistema de Diseño Centralizado
     Descripción: CSS compartido para todos los modales HTML
     FASE 6: Design System
     ============================================================ -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  /* === RESET Y BASE === */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Estilos base para TODOS los modales */
  html, body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: #f8fafc;
    color: #334155;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* === CONTENEDORES === */
  .container {
    background: #ffffff;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  }

  .card {
    background: #ffffff;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    transition: box-shadow 0.3s ease;
  }

  /* === SCROLLBAR PERSONALIZADO === */
  .card::-webkit-scrollbar,
  .container::-webkit-scrollbar {
    width: 6px;
  }
  .card::-webkit-scrollbar-track,
  .container::-webkit-scrollbar-track {
    background: transparent;
  }
  .card::-webkit-scrollbar-thumb,
  .container::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 8px;
  }
  .card::-webkit-scrollbar-thumb:hover,
  .container::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* === TIPOGRAFÍA === */
  h1, h2, h3, h4, h5, h6 {
    color: #0f172a;
    font-weight: 600;
  }
  h2 {
    font-size: 22px;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #94a3b8;
    margin-bottom: 12px;
  }

  /* === FORMULARIOS === */
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    color: #475569;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    background: #ffffff;
    color: #1e293b;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .form-group textarea {
    resize: vertical;
    min-height: 80px;
    line-height: 1.5;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  .form-group input:disabled,
  .form-group select:disabled,
  .form-group textarea:disabled {
    background-color: #f8fafc;
    color: #94a3b8;
    cursor: not-allowed;
    border-color: #f1f5f9;
  }

  .form-row {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
  }
  .form-row .form-group {
    flex: 1;
    margin-bottom: 0;
  }

  /* === INPUT DE CONTRASEÑA CON BOTÓN VER/OCULTAR === */
  .password-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .password-input-wrapper input {
    width: 100%;
    padding-right: 44px;
  }
  .password-toggle-btn {
    position: absolute;
    right: 8px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    transition: color 0.2s;
    border-radius: 4px;
  }
  .password-toggle-btn:hover {
    color: #3b82f6;
    background-color: #eff6ff;
  }
  .password-toggle-btn svg {
    width: 20px;
    height: 20px;
  }

  /* === BOTONES === */
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
  }
  .btn-primary {
    background-color: #2563eb;
    color: #ffffff;
    box-shadow: 0 1px 2px rgba(37, 99, 235, 0.1);
  }
  .btn-primary:hover:not(:disabled) {
    background-color: #1d4ed8;
    box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    transform: translateY(-1px);
  }
  .btn-primary:active:not(:disabled) {
    transform: translateY(0);
  }
  
  .btn-secondary {
    background-color: #f1f5f9;
    color: #475569;
    border: 1px solid #e2e8f0;
  }
  .btn-secondary:hover:not(:disabled) {
    background-color: #e2e8f0;
    color: #1e293b;
  }

  .btn-success {
    background-color: #16a34a;
    color: white;
  }
  .btn-success:hover:not(:disabled) {
    background-color: #15803d;
    box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.2);
    transform: translateY(-1px);
  }

  .btn-danger {
    background-color: #ef4444;
    color: white;
  }
  .btn-danger:hover:not(:disabled) {
    background-color: #b91c1c;
    box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
    transform: translateY(-1px);
  }

  /* === ALERTAS E INFO === */
  .info {
    background-color: #eff6ff;
    border-left: 4px solid #3b82f6;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: #1e293b;
    border-radius: 4px 8px 8px 4px;
  }

  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .alert-success {
    background-color: #f0fdf4;
    border-left: 4px solid #22c55e;
    color: #166534;
  }

  .alert-error {
    background-color: #fef2f2;
    border-left: 4px solid #ef4444;
    color: #991b1b;
  }

  .alert-warning {
    background-color: #fffbeb;
    border-left: 4px solid #f59e0b;
    color: #92400e;
  }

  /* === TOAST NOTIFICATIONS === */
  #toast-container {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
  }

  .toast {
    background-color: #ffffff;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 280px;
    max-width: 380px;
    transform: translateX(120%);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s ease;
    pointer-events: auto;
    border-left: 4px solid #3b82f6;
  }

  .toast.show {
    transform: translateX(0);
    opacity: 1;
  }

  .toast-success { border-left-color: #22c55e; }
  .toast-error { border-left-color: #ef4444; }
  .toast-warning { border-left-color: #f59e0b; }
  .toast-info { border-left-color: #3b82f6; }

  .toast-icon { font-size: 20px; }
  .toast-message { font-size: 14px; font-weight: 500; color: #1e293b; line-height: 1.4; flex: 1; }

  /* === PIN MODAL === */
  .pin-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    animation: fadeIn 0.2s ease-out;
  }

  .pin-overlay.fade-out { animation: fadeOut 0.2s ease-in forwards; }

  .modern-pin-modal {
    background: #ffffff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
    text-align: center;
    width: 280px;
    max-width: 85%;
    transform: scale(0.95);
    animation: scaleIn 0.2s ease-out forwards;
  }

  @keyframes scaleIn { to { transform: scale(1); } }

  .modern-pin-modal h3 { margin-top: 0; color: #0f172a; font-size: 16px; margin-bottom: 8px; font-weight: 600; }
  .modern-pin-modal p { color: #64748b; font-size: 13px; margin-bottom: 20px; }

  .pin-inputs-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }

  .modern-pin-input {
    width: 40px; height: 48px; font-size: 20px; text-align: center; font-weight: 600;
    border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; color: #0f172a; transition: all 0.2s ease;
  }

  .modern-pin-input:focus {
    outline: none; border-color: #3b82f6; background: #ffffff;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
  }

  .modern-pin-input::-webkit-outer-spin-button,
  .modern-pin-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .pin-actions { display: flex; justify-content: center; }
  .pin-actions .cancel-btn { width: 100%; padding: 12px; border-radius: 10px; font-weight: 600; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  /* === LOADING Y PROGRESO PDF === */
  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .loading-overlay.hidden { display: none; }

  .pdf-progress-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    opacity: 1;
    transition: opacity 0.3s;
  }
  .pdf-progress-overlay.hidden {
    display: none;
    opacity: 0;
  }
  .pdf-progress-card {
    background: #ffffff;
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    width: 340px;
    text-align: center;
    transform: scale(0.95);
    animation: scaleIn 0.2s ease-out forwards;
  }
  .pdf-progress-card h3 {
    margin: 0 0 16px 0;
    color: #0f172a;
    font-size: 20px;
    font-weight: 600;
  }
  .pdf-progress-step {
    font-size: 15px;
    color: #64748b;
    margin-bottom: 24px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pdf-progress-bar-bg {
    background: #e2e8f0;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    position: relative;
    margin-bottom: 20px;
  }
  .pdf-progress-bar-fill {
    background: #3b82f6;
    height: 100%;
    width: 0%;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .pdf-spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #f1f5f9;
    border-top: 4px solid #3b82f6;
    border-radius: 50%;
    animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    margin: 0 auto 24px auto;
  }
  
  .spinner {
    border: 4px solid #f1f5f9;
    border-top: 4px solid #2563eb;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    margin-bottom: 16px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loading-text {
    color: #1e293b;
    font-size: 15px;
    font-weight: 500;
  }

  /* === PROGRESS BAR === */
  .progress-container {
    width: 100%;
    background-color: #f1f5f9;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .progress-bar {
    height: 10px;
    background-color: #3b82f6;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* === TABLAS === */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
  }

  th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #e0e0e0;
    font-size: 13px;
  }

  th {
    background-color: #f5f5f5;
    font-weight: 600;
    color: #333;
  }

  tr:hover {
    background-color: #fafafa;
  }

  /* === UTILIDADES === */
  .hidden {
    display: none !important;
  }

  .text-center {
    text-align: center;
  }

  .text-right {
    text-align: right;
  }

  .mt-1 { margin-top: 8px; }
  .mt-2 { margin-top: 16px; }
  .mt-3 { margin-top: 24px; }
  
  .mb-1 { margin-bottom: 8px; }
  .mb-2 { margin-bottom: 16px; }
  .mb-3 { margin-bottom: 24px; }

  .p-1 { padding: 8px; }
  .p-2 { padding: 16px; }
  .p-3 { padding: 24px; }

  /* === DRAG & RESIZE HANDLES === */
  #modal-drag-handle {
    display: none;  /* Ocultar drag handle azul - usar solo el título nativo gris de Google Sheets */
  }

  #modal-drag-handle-title {
    display: none;
  }

  #modal-drag-handle-close {
    display: none;
  }

  #modal-resize-handle {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 20px;
    height: 20px;
    cursor: nwse-resize;
    z-index: 10000;
    background: linear-gradient(135deg, transparent 0%, transparent 50%, #94a3b8 50%, #94a3b8 100%);
    border-bottom-right-radius: 12px;
  }

  #modal-resize-handle:hover {
    background: linear-gradient(135deg, transparent 0%, transparent 50%, #64748b 50%, #64748b 100%);
  }

  /* Ajuste del body y contenedores cuando hay drag handle */
  /* El drag handle azul está oculto - se usa solo el título nativo gris de Google Sheets */
  body.has-drag-handle .container,
  body.has-drag-handle .card {
    margin-top: 0;
  }

  /* === RESPONSIVE === */
  @media (min-width: 500px) {
    .card { padding: 24px; }
  }

  @media (min-width: 600px) {
    .card { padding: 32px; }
  }

  @media (min-height: 600px) {
    .section { margin-bottom: 24px; }
    .field { margin-bottom: 18px; }
  }

  @media (min-height: 700px) {
    .section { margin-bottom: 28px; }
    .field { margin-bottom: 20px; }
  }
</style>
