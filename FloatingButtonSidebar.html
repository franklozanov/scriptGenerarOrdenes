  <script>
    // Manejar clic en el botón de acción
    document.getElementById('action-button').addEventListener('click', function() {
      // Llamar a la función de Apps Script para abrir el modal
      google.script.run
        .withSuccessHandler(function() {
          console.log('Modal de novedad abierto exitosamente');
        })
        .withFailureHandler(function(error) {
          console.error('Error al abrir modal:', error);
          alert('Error al abrir el modal de novedad. Por favor, intente nuevamente.');
        })
        .abrirModalRegistroNovedad();
    });
    
    // Manejar minimizar/maximizar
    var isMinimized = false;
    var minimizeBtn = document.getElementById('minimize-btn');
    var header = document.getElementById('header');
    
    function toggleMinimize() {
      isMinimized = !isMinimized;
      document.body.classList.toggle('minimized', isMinimized);
      minimizeBtn.textContent = isMinimized ? '+' : '−';
      minimizeBtn.title = isMinimized ? 'Maximizar' : 'Minimizar';
    }
    
    minimizeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleMinimize();
    });
    
    // Hacer clic en el header cuando está minimizado para expandir
    header.addEventListener('click', function() {
      if (isMinimized) {
        toggleMinimize();
      }
    });
  </script>
