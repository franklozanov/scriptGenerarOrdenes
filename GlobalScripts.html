<script>
  // === CONTEXTO GLOBAL DE LA APLICACIÓN (QMS) ===
  window.QMSContext = {
    users: null,
    templates: null,
    webAppUrl: '',
    userPin: '',
    userPermissions: {}
  };

  // === UTILIDADES GENERALES ===

  /**
   * Muestra un overlay de carga
   * @param {string} message - Mensaje a mostrar
   */
  function showLoading(message = 'Procesando...') {
    const overlay = document.getElementById('loading-overlay');
    const text = document.getElementById('loading-text');
    if (overlay) {
      if (text) text.textContent = message;
      overlay.classList.remove('hidden');
    }
  }

  /**
   * Oculta el overlay de carga
   */
  function hideLoading() {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.classList.add('hidden');
    }
  }

  /**
   * Muestra un mensaje de alerta
   * @param {string} message - Mensaje a mostrar
   * @param {string} type - Tipo de alerta: 'success', 'error', 'warning'
   */
  function showAlert(message, type = 'info') {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type}`;
    alertDiv.textContent = message;
    
    const container = document.querySelector('.container') || document.body;
    container.insertBefore(alertDiv, container.firstChild);
    
    setTimeout(() => {
      alertDiv.remove();
    }, 5000);
  }

  /**
   * Muestra un mensaje de éxito y cierra el modal
   * @param {string} message - Mensaje de éxito
   */
  function showSuccessAndClose(message) {
    showAlert(message, 'success');
    setTimeout(() => {
      google.script.host.close();
    }, 2000);
  }

  /**
   * Muestra un mensaje de error
   * @param {string} message - Mensaje de error
   */
  function showError(message) {
    hideLoading();
    showAlert(message, 'error');
  }

  /**
   * Valida que un campo no esté vacío
   * @param {string} value - Valor a validar
   * @param {string} fieldName - Nombre del campo
   * @returns {boolean} True si es válido
   */
  function validateRequired(value, fieldName) {
    if (!value || value.toString().trim() === '') {
      showError(`El campo "${fieldName}" es obligatorio.`);
      return false;
    }
    return true;
  }

  /**
   * Valida un email
   * @param {string} email - Email a validar
   * @returns {boolean} True si es válido
   */
  function validateEmail(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
  }

  /**
   * Formatea una fecha a string
   * @param {Date} date - Fecha a formatear
   * @returns {string} Fecha formateada YYYY-MM-DD
   */
  function formatDate(date) {
    if (!(date instanceof Date)) date = new Date(date);
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  /**
   * Formatea una fecha y hora a string
   * @param {Date} date - Fecha a formatear
   * @returns {string} Fecha formateada YYYY-MM-DD HH:mm:ss
   */
  function formatDateTime(date) {
    if (!(date instanceof Date)) date = new Date(date);
    const dateStr = formatDate(date);
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${dateStr} ${hours}:${minutes}:${seconds}`;
  }

  /**
   * Escapa HTML para prevenir XSS
   * @param {string} text - Texto a escapar
   * @returns {string} Texto escapado
   */
  function escapeHtml(text) {
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  /**
   * Debounce para limitar ejecución de funciones
   * @param {Function} func - Función a ejecutar
   * @param {number} wait - Tiempo de espera en ms
   * @returns {Function} Función debounced
   */
  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }

  // === MANEJO DE ARCHIVOS ===

  /**
   * Convierte un archivo a base64
   * @param {File} file - Archivo a convertir
   * @returns {Promise<string>} Base64 del archivo
   */
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /**
   * Valida el tipo de archivo
   * @param {File} file - Archivo a validar
   * @param {string[]} allowedTypes - Tipos permitidos
   * @returns {boolean} True si es válido
   */
  function validateFileType(file, allowedTypes) {
    if (!allowedTypes.includes(file.type)) {
      showError(`Tipo de archivo no permitido. Solo se permiten: ${allowedTypes.join(', ')}`);
      return false;
    }
    return true;
  }

  /**
   * Valida el tamaño del archivo
   * @param {File} file - Archivo a validar
   * @param {number} maxSizeMB - Tamaño máximo en MB
   * @returns {boolean} True si es válido
   */
  function validateFileSize(file, maxSizeMB) {
    const maxBytes = maxSizeMB * 1024 * 1024;
    if (file.size > maxBytes) {
      showError(`El archivo es demasiado grande. Tamaño máximo: ${maxSizeMB}MB`);
      return false;
    }
    return true;
  }

  /**
   * Formatea bytes a tamaño legible
   * @param {number} bytes - Bytes a formatear
   * @returns {string} Tamaño formateado
   */
  function formatBytes(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
  }

  // === MANEJO DE FORMULARIOS ===

  /**
   * Obtiene los datos de un formulario
   * @param {string} formId - ID del formulario
   * @returns {Object} Datos del formulario
   */
  function getFormData(formId) {
    const form = document.getElementById(formId);
    if (!form) return {};
    
    const formData = new FormData(form);
    const data = {};
    
    for (let [key, value] of formData.entries()) {
      data[key] = value;
    }
    
    return data;
  }

  /**
   * Resetea un formulario
   * @param {string} formId - ID del formulario
   */
  function resetForm(formId) {
    const form = document.getElementById(formId);
    if (form) form.reset();
  }

  /**
   * Deshabilita todos los inputs de un formulario
   * @param {string} formId - ID del formulario
   * @param {boolean} disabled - True para deshabilitar
   */
  function disableForm(formId, disabled = true) {
    const form = document.getElementById(formId);
    if (!form) return;
    
    const inputs = form.querySelectorAll('input, select, textarea, button');
    inputs.forEach(input => {
      input.disabled = disabled;
    });
  }

  // === MANEJO DE ERRORES ===

  /**
   * Maneja errores de llamadas a Google Apps Script
   * @param {Error} error - Error capturado
   * @param {string} context - Contexto del error
   */
  function handleServerError(error, context = '') {
    console.error(`Error en ${context}:`, error);
    hideLoading();
    
    let message = 'Ocurrió un error al procesar la solicitud.';
    
    if (error && error.message) {
      message = error.message;
    }
    
    if (context) {
      message = `${context}: ${message}`;
    }
    
    showError(message);
  }

  // === INICIALIZACIÓN ===

  /**
   * Ejecuta código cuando el DOM está listo
   * @param {Function} callback - Función a ejecutar
   */
  function onReady(callback) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', callback);
    } else {
      callback();
    }
  }

  // === UTILIDADES DE UI ===

  /**
   * Actualiza una barra de progreso
   * @param {string} barId - ID de la barra de progreso
   * @param {number} percent - Porcentaje (0-100)
   */
  function updateProgress(barId, percent) {
    const bar = document.getElementById(barId);
    if (bar) {
      bar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
    }
  }

  /**
   * Muestra/oculta un elemento
   * @param {string} elementId - ID del elemento
   * @param {boolean} show - True para mostrar
   */
  function toggleElement(elementId, show) {
    const element = document.getElementById(elementId);
    if (element) {
      if (show) {
        element.classList.remove('hidden');
      } else {
        element.classList.add('hidden');
      }
    }
  }

  /**
   * Alterna la visibilidad de un campo de contraseña
   * @param {string} inputId - ID del input de contraseña
   * @param {string} buttonId - ID del botón toggle
   */
  function togglePasswordVisibility(inputId, buttonId) {
    const input = document.getElementById(inputId);
    const button = document.getElementById(buttonId);
    
    if (!input || !button) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      // Cambiar icono a "ojo cerrado"
      button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      button.setAttribute('aria-label', 'Ocultar contraseña');
      button.setAttribute('title', 'Ocultar contraseña');
    } else {
      input.type = 'password';
      // Cambiar icono a "ojo abierto"
      button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      button.setAttribute('aria-label', 'Mostrar contraseña');
      button.setAttribute('title', 'Mostrar contraseña');
    }
  }

  // === DRAG & RESIZE MODAL SYSTEM ===

  /**
   * Inicializa el sistema de drag y resize para modales
   * @param {Object} options - Opciones de configuración
   * @param {string} options.title - Título del modal
   * @param {boolean} options.enableDrag - Habilitar arrastre (default: true)
   * @param {boolean} options.enableResize - Habilitar redimensionamiento (default: true)
   * @param {number} options.minWidth - Ancho mínimo en px (default: 400)
   * @param {number} options.minHeight - Alto mínimo en px (default: 500)
   * @param {number} options.maxWidth - Ancho máximo en px (default: 1200)
   * @param {number} options.maxHeight - Alto máximo en px (default: 1000)
   */
  function initializeModalDragResize(options) {
    options = options || {};
    const title = options.title || 'Modal';
    const enableDrag = options.enableDrag !== false;
    const enableResize = options.enableResize !== false;
    const minWidth = options.minWidth || 400;
    const minHeight = options.minHeight || 500;
    const maxWidth = options.maxWidth || 1200;
    const maxHeight = options.maxHeight || 1000;

    // Crear drag handle si está habilitado
    if (enableDrag) {
      const dragHandle = document.createElement('div');
      dragHandle.id = 'modal-drag-handle';
      dragHandle.innerHTML = `
        <div id="modal-drag-handle-title">${title}</div>
        <div id="modal-drag-handle-close">×</div>
      `;
      document.body.insertBefore(dragHandle, document.body.firstChild);
      document.body.classList.add('has-drag-handle');

      // Event listener para cerrar
      document.getElementById('modal-drag-handle-close').addEventListener('click', function() {
        google.script.host.close();
      });

      // Inicializar lógica de drag
      initializeDrag(dragHandle);
    }

    // Crear resize handle si está habilitado
    if (enableResize) {
      const resizeHandle = document.createElement('div');
      resizeHandle.id = 'modal-resize-handle';
      document.body.appendChild(resizeHandle);

      // Inicializar lógica de resize
      initializeResize(resizeHandle, minWidth, minHeight, maxWidth, maxHeight);
    }
  }

  /**
   * Inicializa la lógica de arrastre del modal
   * @param {HTMLElement} dragHandle - Elemento del drag handle
   */
  function initializeDrag(dragHandle) {
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;

    function startDrag(e) {
      // Ignorar si se hace clic en el botón de cerrar
      if (e.target.id === 'modal-drag-handle-close') return;
      
      isDragging = true;
      offsetX = e.clientX;
      offsetY = e.clientY;
      
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', stopDrag, { once: true });
      
      e.preventDefault();
    }

    function onDragMove(e) {
      if (!isDragging) return;
      
      const dx = e.clientX - offsetX;
      const dy = e.clientY - offsetY;
      
      try {
        google.script.host.moveBy(dx, dy);
      } catch (err) {
        console.error('Error al mover modal:', err);
      }
      
      // Actualizar offset para el siguiente movimiento
      offsetX = e.clientX;
      offsetY = e.clientY;
      
      e.preventDefault();
    }

    function stopDrag() {
      isDragging = false;
      document.removeEventListener('mousemove', onDragMove);
    }

    dragHandle.addEventListener('mousedown', startDrag);
  }

  /**
   * Inicializa la lógica de redimensionamiento del modal
   * @param {HTMLElement} resizeHandle - Elemento del resize handle
   * @param {number} minWidth - Ancho mínimo
   * @param {number} minHeight - Alto mínimo
   * @param {number} maxWidth - Ancho máximo
   * @param {number} maxHeight - Alto máximo
   */
  function initializeResize(resizeHandle, minWidth, minHeight, maxWidth, maxHeight) {
    let isResizing = false;
    let startWidth = 0;
    let startHeight = 0;
    let startX = 0;
    let startY = 0;
    let rafId = null;

    function startResize(e) {
      // Solo activar con clic izquierdo
      if (e.button !== 0) return;
      
      // Prevenir múltiples activaciones
      if (isResizing) return;
      
      isResizing = true;
      startX = e.clientX;
      startY = e.clientY;
      
      // Obtener dimensiones actuales del diálogo
      startWidth = window.innerWidth;
      startHeight = window.innerHeight;
      
      // Añadir feedback visual
      document.body.style.cursor = 'nwse-resize';
      document.body.style.userSelect = 'none';
      resizeHandle.style.background = 'linear-gradient(135deg, transparent 0%, transparent 50%, #64748b 50%, #64748b 100%)';
      
      // Añadir listeners
      document.addEventListener('mousemove', handleResize, { passive: false });
      document.addEventListener('mouseup', stopResize, { once: true });
      
      e.preventDefault();
      e.stopPropagation();
    }

    function handleResize(e) {
      if (!isResizing) return;
      
      e.preventDefault();
      e.stopPropagation();
      
      // Cancelar frame anterior si existe
      if (rafId) {
        cancelAnimationFrame(rafId);
      }
      
      // Usar requestAnimationFrame para suavizar
      rafId = requestAnimationFrame(function() {
        if (!isResizing) return;
        
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        
        const newWidth = Math.max(minWidth, Math.min(maxWidth, startWidth + deltaX));
        const newHeight = Math.max(minHeight, Math.min(maxHeight, startHeight + deltaY));
        
        try {
          google.script.host.setWidth(newWidth);
          google.script.host.setHeight(newHeight);
        } catch (err) {
          console.error('Error al redimensionar:', err);
        }
        
        rafId = null;
      });
    }

    function stopResize(e) {
      // Forzar detención inmediata
      isResizing = false;
      
      // Cancelar cualquier frame pendiente
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      
      // Restaurar estilos normales
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      resizeHandle.style.background = 'linear-gradient(135deg, transparent 0%, transparent 50%, #94a3b8 50%, #94a3b8 100%)';
      
      // Remover listener de mousemove
      document.removeEventListener('mousemove', handleResize);
      
      // Resetear variables
      startX = 0;
      startY = 0;
      startWidth = 0;
      startHeight = 0;
      
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
    }

    resizeHandle.addEventListener('mousedown', startResize);
    
    // Seguridad adicional: detener en mouseleave del documento
    document.addEventListener('mouseleave', function() {
      if (isResizing) {
        stopResize();
      }
    });
  }

  // === SISTEMA DE PERMISOS RBAC (FRONTEND) ===

  /**
   * Establece los permisos del usuario actual en el contexto global y aplica las restricciones de UI
   * @param {Object} permissions - Objeto de permisos del usuario
   */
  function setFrontendPermissions(permissions) {
    window.QMSContext.userPermissions = permissions || {};
    applyFrontendPermissions();
  }

  /**
   * Verifica si el usuario tiene un permiso específico
   * @param {string} permissionKey - Clave del permiso a verificar
   * @returns {boolean} True si tiene el permiso
   */
  function checkPermission(permissionKey) {
    return window.QMSContext.userPermissions[permissionKey] === true;
  }

  /**
   * Aplica las restricciones de permisos a los elementos del DOM
   * Busca elementos con atributo data-requires-permission y los oculta si el usuario no tiene el permiso
   */
  function applyFrontendPermissions() {
    var elementsWithPermissions = document.querySelectorAll('[data-requires-permission]');
    
    elementsWithPermissions.forEach(function(element) {
      var requiredPermission = element.getAttribute('data-requires-permission');
      
      if (!checkPermission(requiredPermission)) {
        element.classList.add('hidden');
        element.style.display = 'none';
      }
    });
  }
</script>
