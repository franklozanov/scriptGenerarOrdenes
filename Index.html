    <script>
      const SPREADSHEET_ID = '<?= typeof spreadsheetId !== "undefined" ? spreadsheetId : "" ?>';
      let globalTemplates = [];
      let preloadedStaticPdfs = {}; // Store preloaded static template objects { base64, fileId }
      let preloadState = { orderNo: null, status: 'idle', data: null, pdfsByKey: {}, errors: [] }; // Background preloading state
      window.currentTemplatesVersion = null;

      function isStaticTemplate(t) {
        if (!t || !t.type) return false;
        const s = t.type.toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        return s === 'estatica' || s === 'static';
      }

      function isActiveTemplate(t) {
        if (!t) return false;
        if (t.key === 'DOC_COMPLETO' || (t.type && t.type.toString().toLowerCase().includes('coord'))) return false;
        const estado = (t.estado || '').toString().trim().toLowerCase();
        return estado === 'activa' || estado === 'activo' || estado === 'true' || estado === '1';
      }

      function safeCopiesValue(copias) {
        if (copias == null || copias === "" || isNaN(copias)) return "1";
        const num = parseInt(copias, 10);
        return (isNaN(num) || num < 0) ? "1" : String(num);
      }

      // Función debounce() ahora viene de GlobalScripts.html

      function setPreloadBanner(type, message) {
        const banner = document.getElementById('preloadBanner');
        if (!banner) return;
        if (!message) {
          banner.className = 'preload-banner';
          banner.innerHTML = '';
          return;
        }
        banner.className = 'preload-banner ' + type;
        banner.innerHTML = message;
      }

      function clearStatus() {
        const status = document.getElementById('status');
        if (status) {
          status.className = '';
          status.innerHTML = '';
        }
      }

      function setStatusMessage(type, message) {
        const status = document.getElementById('status');
        if (!status) return;
        if (!message) {
          clearStatus();
          return;
        }
        let iconSvg = '';
        if (type === 'loading') {
          iconSvg = '<svg class="spinning" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.2"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>';
        } else if (type === 'success') {
          iconSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
        } else if (type === 'warning') {
          iconSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
        } else if (type === 'error') {
          iconSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
        } else if (type === 'info') {
          iconSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
        }
        status.className = 'status-pill status-pill-' + (type || 'info');
        status.innerHTML = iconSvg + '<span>' + message + '</span>';
      }

      function resetPreloadState() {
        preloadState = { orderNo: null, status: 'idle', data: null, pdfsByKey: {}, errors: [] };
        clearStatus();
        updateGoButtonState();
      }

      function buildPdfsByKey(pdfs) {
        const pdfsByKey = {};
        (pdfs || []).forEach(pdf => {
          pdfsByKey[pdf.key] = pdf;
        });
        return pdfsByKey;
      }

      function isPreloadReadyForOrder(orderNo) {
        return preloadState.orderNo === orderNo &&
          preloadState.status === 'ready' &&
          preloadState.data &&
          preloadState.pdfsByKey.DOC_ORDENES &&
          preloadState.pdfsByKey.DOC_ANALISIS;
      }

      function getTemplateFriendlyName(key) {
        if (!key) return "Documento";
        const tpl = globalTemplates.find(t => t.key === key);
        if (tpl && tpl.name) return tpl.name;
        if (key === 'DOC_ORDENES') return 'Orden de Producción';
        if (key === 'DOC_ANALISIS') return 'Certificado de Análisis';
        return key;
      }

      function renderPreloadResult(response) {
        const warnings = response.warnings || [];
        const errors = response.errors || [];
        
        if (errors.length === 0 && warnings.length === 0) {
          setPreloadBanner('success', 'Orden lista para impresión');
        } else {
          let html = '<b>Novedades encontradas:</b><br><ul style="margin: 4px 0 0 20px; padding: 0; line-height: 1.4;">';
          
          errors.forEach(err => {
            let msg = err.message;
            if (err.key) {
               msg = 'Falta Documento: <b>' + getTemplateFriendlyName(err.key) + '</b>';
            }
            html += '<li>' + msg + '</li>';
          });
          
          warnings.forEach(w => {
            let msg = w.message;
            if (w.key === 'DECISION_FORMULA_ALERT' || w.key === 'STATUS_FORMULA_ALERT') {
               msg = 'Alerta en validación: <b>' + w.message + '</b>';
            }
            html += '<li>' + msg + '</li>';
          });
          
          html += '</ul>';
          
          if (errors.length > 0) {
            setPreloadBanner('error', html);
          } else {
            setPreloadBanner('warning', html);
          }
        }
        
        updateGoButtonState();
      }

      function hasAnyCopiesSelected() {
        const activeTemplates = (globalTemplates || []).filter(isActiveTemplate);
        return activeTemplates.some(t => {
          const input = document.getElementById('val_' + t.key);
          return input && (parseInt(input.value) || 0) > 0;
        });
      }

      function isUserSelectionValid() {
        if (window.currentUserIdentity) return true; // Autenticado
        
        const userNameInput = document.getElementById('userName');
        if (!userNameInput || !window.globalUsers) return false;
        const val = userNameInput.value.trim();
        if (!val) return false;
        return window.globalUsers.some(u => u.nombreCompleto === val);
      }

      function updateGoButtonState() {
        const btn = document.getElementById('goBtn');
        const orderInput = document.getElementById('orderNo');
        const status = document.getElementById('status');
        if (!btn || !orderInput) return;
        
        const isOrderReady = isPreloadReadyForOrder(orderInput.value.trim());
        const isUserValid = isUserSelectionValid();
        const hasCopies = hasAnyCopiesSelected();
        
        const isEnabled = isOrderReady && isUserValid && hasCopies;
        btn.disabled = !isEnabled;

        // Feedback visual si el orden está listo pero el botón sigue bloqueado
        if (isOrderReady && !isEnabled && !status.innerText.includes("Impresión registrada")) {
          if (!isUserValid) {
            setStatusMessage('warning', 'Seleccione un usuario válido de la lista');
          } else if (!hasCopies) {
            setStatusMessage('warning', 'Seleccione al menos 1 copia para imprimir');
          }
        } else if (isOrderReady && isEnabled) {
          if (preloadState.data && preloadState.data.warnings && preloadState.data.warnings.length > 0) {
            setStatusMessage('warning', 'Orden lista con alertas en validación');
          } else {
            setStatusMessage('success', 'Documentos listos para impresión');
          }
        } else if (!isOrderReady && preloadState.status !== 'loading' && !status.innerText.includes("Impresión registrada")) {
          clearStatus();
        }
      }

      // Precarga en paralelo de las plantillas estáticas al abrir el modal.
      // NO bloquea la apertura: se dispara en segundo plano y va llenando
      // preloadedStaticPdfs. Así, cuando el usuario genere el PDF, las estáticas
      // ya están en memoria (percepción de velocidad máxima). Si alguna aún no
      // terminó, processPdfGeneration la descarga on-demand como respaldo.
      function startBackgroundStaticPreload() {
        // Solo las plantillas estáticas reales son Type === 'Estatica' (un PDF fijo).
        // Las Dinamica (DOC_ORDENES/DOC_ANALISIS dinámicas, DOC_COMPLETO destino) y
        // las Coordinate NO se precargan aquí.
        const staticTemplates = (globalTemplates || []).filter(t =>
          isStaticTemplate(t) && t.hasAccess && t.fileId
        );
        if (staticTemplates.length === 0) return;
        console.log(`🚀 Precargando ${staticTemplates.length} plantillas estáticas en segundo plano...`);
        staticTemplates.forEach(t => {
          const cached = preloadedStaticPdfs[t.key];
          if (cached && (cached.fileId === t.fileId || cached === t.fileId)) return; // ya en memoria con el ID correcto
          google.script.run
            .withSuccessHandler(base64 => {
              if (base64) {
                preloadedStaticPdfs[t.key] = { base64: base64, fileId: t.fileId };
                console.log(`✓ [Background] Precargada: ${t.key} (ID: ${t.fileId})`);
              }
            })
            .withFailureHandler(err => {
              // No es crítico: si falla, se reintenta on-demand al generar.
              console.log(`⚠️ [Background] No se pudo precargar ${t.key}:`, err && err.message ? err.message : err);
            })
            .getStaticTemplateBase64(t.key, t.fileId);
        });
      }

      // Background preloading function
      function preloadOrderData(orderNo) {
        const currentOrderNo = orderNo.trim();
        if (!currentOrderNo) {
          resetPreloadState();
          setPreloadBanner('', '');
          return;
        }
        
        // If already fetching for this order, don't start another request
        if (preloadState.status === 'loading' && preloadState.orderNo === currentOrderNo) {
          return;
        }
        
        // If already loaded for this order, no need to fetch again
        if (isPreloadReadyForOrder(currentOrderNo)) {
          return;
        }
        
        // Start fetching
        preloadState.orderNo = currentOrderNo;
        preloadState.status = 'loading';
        preloadState.data = null;
        preloadState.pdfsByKey = {};
        preloadState.errors = [];
        updateGoButtonState();
        
        // Show subtle status message
        const status = document.getElementById('status');
        setPreloadBanner('info', 'Buscando documentos de la orden...');
        if (status && !status.innerText.includes("Impresión registrada")) {
          setStatusMessage('loading', 'Buscando documentos de la orden...');
        }
        
        google.script.run
          .withSuccessHandler(response => {
            // Race condition control: only accept response if it matches current orderNo
            const currentInput = document.getElementById('orderNo').value.trim();
            if (currentInput !== currentOrderNo) {
              console.log(`⚠️ Descartando respuesta obsoleta para orden ${currentOrderNo} (actual: ${currentInput})`);
              return;
            }
            
            preloadState.status = response.ready ? 'ready' : 'error';
            preloadState.data = response;
            preloadState.pdfsByKey = buildPdfsByKey(response.pdfs);
            preloadState.errors = response.errors || [];
            
            console.log(`✓ Datos precargados para orden ${currentOrderNo}`);
            renderPreloadResult(response);
            
            // Update status to show data is ready
            if (status && !status.innerText.includes("Impresión registrada")) {
              if (response.ready) {
                if (response.warnings && response.warnings.length > 0) {
                  setStatusMessage('warning', 'Orden lista con alertas en validación');
                } else {
                  setStatusMessage('success', 'Documentos listos para impresión');
                }
              } else {
                setStatusMessage('error', 'Faltan documentos requeridos');
              }
            }
          })
          .withFailureHandler(error => {
            // Race condition control: only accept error if it matches current orderNo
            const currentInput = document.getElementById('orderNo').value.trim();
            if (currentInput !== currentOrderNo) {
              console.log(`⚠️ Descartando error obsoleto para orden ${currentOrderNo} (actual: ${currentInput})`);
              return;
            }
            
            preloadState.status = 'error';
            preloadState.data = null;
            preloadState.pdfsByKey = {};
            preloadState.errors = [{ key: 'server', message: error.message }];
            updateGoButtonState();
            
            console.error(`Error precargando orden ${currentOrderNo}:`, error.message);
            setPreloadBanner('error', `Error: ${error.message}`);
            
            // Show error in status
            if (status) {
              setStatusMessage('error', `Error: ${error.message}`);
            }
          })
          .fetchOrderData(currentOrderNo);
      }

      // Counter control functions
      function decrementCounter(key, noAccess) {
        if (noAccess) return;
        const input = document.getElementById('val_' + key);
        let value = parseInt(input.value) || 0;
        if (value > 0) {
          input.value = value - 1;
        }
        updateGoButtonState();
      }

      function incrementCounter(key, noAccess) {
        if (noAccess) return;
        const input = document.getElementById('val_' + key);
        let value = parseInt(input.value) || 0;
        if (value < 999) {
          input.value = value + 1;
        }
        updateGoButtonState();
      }

      function validateCounter(input) {
        // Permitir que el campo esté temporalmente vacío mientras se borra/escribe
        if (input.value === '') {
          updateGoButtonState();
          return;
        }
        
        let value = parseInt(input.value);
        if (isNaN(value)) {
          input.value = ''; // Borra caracteres no numéricos
          updateGoButtonState();
          return;
        }
        
        if (value < 0) {
          value = 0;
        } else if (value > 999) {
          value = 999;
        }
        input.value = value;
        updateGoButtonState();
      }

      function renderTemplatesList(templates, preserveValues = false) {
        const activeTemplates = (templates || []).filter(isActiveTemplate);
        
        document.getElementById('tplList').innerHTML = activeTemplates.map(t => {
          let defVal = safeCopiesValue(t.copias);
          if (preserveValues) {
            const existingInput = document.getElementById('val_' + t.key);
            if (existingInput && existingInput.value !== "") {
              defVal = existingInput.value;
            }
          }
          
          const noAccess = t.hasAccess === false;
          const rowStyle = noAccess ? 'opacity: 0.5;' : '';
          const nameStyle = noAccess ? 'color: #dc2626; font-style: italic;' : '';
          const descriptionHtml = t.description ? `<div style="font-size: 0.75em; color: #64748b; margin-top: 2px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${t.description}">${t.description}</div>` : '';
          return `
            <div class="tpl-row" style="${rowStyle} display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #e2e8f0;">
              <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; margin-right: 12px;">
                <span class="tpl-name" title="${t.name}" style="${nameStyle} font-weight: 500; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${t.name}</span>
                ${descriptionHtml}
              </div>
              <div class="counter-control" style="flex-shrink: 0; width: 110px;">
                <button type="button" class="counter-btn" tabindex="-1" onclick="decrementCounter('${t.key}', ${noAccess})" ${noAccess ? 'disabled' : ''}>−</button>
                <input type="text" class="counter-input" id="val_${t.key}" value="${defVal}" maxlength="3" ${noAccess ? 'disabled' : ''} oninput="validateCounter(this)">
                <button type="button" class="counter-btn" tabindex="-1" onclick="incrementCounter('${t.key}', ${noAccess})" ${noAccess ? 'disabled' : ''}>+</button>
              </div>
            </div>
          `;
        }).join('');
      }

      function refreshTemplatesFromSheet(silent = false) {
        const btn = document.getElementById('refreshTemplatesBtn');
        const icon = document.getElementById('refreshTemplatesIcon');
        const text = document.getElementById('refreshTemplatesText');
        if (!silent) {
          if (btn) btn.disabled = true;
          if (icon) icon.classList.add('spinning');
          if (text) text.innerText = 'Actualizando...';
        }

        // Limpiar memoria local de plantillas precargadas
        preloadedStaticPdfs = {};

        google.script.run
          .withSuccessHandler(data => {
            if (!silent) {
              if (btn) btn.disabled = false;
              if (icon) icon.classList.remove('spinning');
              if (text) text.innerText = 'Actualizar';
            }
            if (data && data.templates) {
              globalTemplates = data.templates;
              window.currentTemplatesVersion = data.templatesVersion || '0';
              renderTemplatesList(data.templates, true);
              startBackgroundStaticPreload();
              updateGoButtonState();

              const noAccessCount = data.templates.filter(t => t.hasAccess === false).length;
              const status = document.getElementById('status');
              if (status) {
                if (noAccessCount > 0) {
                  status.innerHTML = `<span class="error-text">Advertencia: ${noAccessCount} plantilla(s) sin acceso. Use el menú "Diagnosticar Plantillas" para más detalles.</span>`;
                  status.className = "error-text";
                } else if (!silent) {
                  status.innerText = "Plantillas actualizadas correctamente con la hoja.";
                  status.className = "success-text";
                  setTimeout(() => {
                    if (status.innerText && status.innerText.indexOf("actualizadas") !== -1) {
                      status.innerText = "";
                    }
                  }, 4000);
                }
              }
            }
          })
          .withFailureHandler(err => {
            if (!silent) {
              if (btn) btn.disabled = false;
              if (icon) icon.classList.remove('spinning');
              if (text) text.innerText = 'Actualizar';
              const status = document.getElementById('status');
              if (status) {
                status.innerText = "Error actualizando plantillas: " + (err && err.message ? err.message : err);
                status.className = "error-text";
              }
            }
          })
          .forzarRecargaPlantillasCliente(SPREADSHEET_ID);
      }

      let templatesZeroed = false;

      function toggleTemplateValues() {
        const btn = document.getElementById('toggleValuesBtn');
        const activeTemplates = (globalTemplates || []).filter(isActiveTemplate);
        
        if (!templatesZeroed) {
          // Llevar todo a cero
          activeTemplates.forEach(t => {
            const input = document.getElementById('val_' + t.key);
            if (input && !input.disabled) {
              input.value = "0";
            }
          });
          templatesZeroed = true;
          document.getElementById('toggleValuesText').innerText = "Valores Standard";
        } else {
          // Restaurar valores por defecto (standard)
          activeTemplates.forEach(t => {
            const input = document.getElementById('val_' + t.key);
            if (input && !input.disabled) {
              input.value = safeCopiesValue(t.copias);
            }
          });
          templatesZeroed = false;
          document.getElementById('toggleValuesText').innerText = "Llevar a 0";
        }
        updateGoButtonState();
      }

      function buildPayloadFromPreload(config) {
        const pdfs = [];
        config.forEach(cfg => {
          if (cfg.key === "DOC_ORDENES" || cfg.key === "DOC_ANALISIS") {
            const dynamicPdf = preloadState.pdfsByKey[cfg.key];
            if (!dynamicPdf) {
              throw new Error(`Falta el archivo para ${cfg.key}.`);
            }
            pdfs.push({
              key: cfg.key,
              base64: dynamicPdf.base64,
              copies: cfg.copies
            });
          }
        });

        return {
          formData: preloadState.data.formData,
          coords: preloadState.data.coords,
          pdfs: pdfs
        };
      }

      function gsRun(fnName, args) {
        return new Promise((resolve, reject) => {
          let runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(e => reject(new Error(e.message || String(e))));
          runner[fnName].apply(runner, args);
        });
      }

      function saveFinalUnifiedPdfAsync(base64Data, orderNo, userId) {
        if (!userId) return Promise.reject(new Error("No se pudo identificar el UserID del usuario seleccionado."));
        return gsRun('saveFinalUnifiedPDFForUser', [base64Data, orderNo, userId]);
      }

      function updateTraceabilityAsync(orderNo, userId, totalPages, printType) {
        if (!userId) return Promise.reject(new Error("No se pudo identificar el UserID del usuario seleccionado."));
        return gsRun('updateTraceabilityForUser', [orderNo, userId, totalPages, printType]);
      }

      function finalizeFinalPdfPostSaveAsync(orderNo, fileId, archivoReemplazado, userId) {
        if (!userId) return Promise.reject(new Error("No se pudo identificar el UserID del usuario seleccionado."));
        return gsRun('finalizeFinalPdfForUser', [orderNo, fileId, archivoReemplazado, userId]);
      }

      function uint8ArrayToBase64(bytes) {
        const chunkSize = 0x8000;
        let binary = '';
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary);
      }
      function openSavedPdfPreview(saveResult) {
        const viewerUrl = saveResult.viewerUrl
          || ('https://drive.google.com/file/d/' + saveResult.fileId + '/view');
        const opened = window.open(viewerUrl, '_blank');
        if (!opened) {
          throw new Error('POPUP_BLOCKED:' + viewerUrl);
        }
      }

                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">

              </div>`;

              } else {
                resetPreloadState();
                setPreloadBanner('', '');
                clearStatus();

            }, 600);
            
            orderNoInput.addEventListener('input', (e) => {
              const val = e.target.value.trim();
              if (val.length < 3) {
                resetPreloadState();
                setPreloadBanner('', '');

              } else if (preloadState.orderNo && preloadState.orderNo !== val) {
                resetPreloadState();
                setPreloadBanner('', '');
                clearStatus();
              }
              updateGoButtonState();
              debouncedPreload(e.target.value);

            orderNoInput.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {

                document.getElementById('goBtn').click();

            // Sincronización automática silenciosa si la versión de plantillas cambió en el servidor

                .withSuccessHandler(serverVersion => {

            // --- FIN INICIALIZACIÓN UI ---

                onUserValidated(matchedUsers[data.savedProfileIdx]);

                startBackgroundStaticPreload();
              } else {
                // Múltiples perfiles sin selección previa: mostrar selector
                const loader = document.getElementById('loader');
                const optionsHtml = matchedUsers.map((u, idx) =>
                  `<option value="${idx}">${u.nombreCompleto} (${u.rol || 'Sin rol'})</option>`

                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                      </svg>
                    </div>
                    <h3 style="margin:0 0 8px 0; color:#0f172a; font-size:1rem;">Selecciona tu perfil</h3>
                    <p style="margin:0 0 16px 0; color:#64748b; font-size:0.85rem;">Tu correo tiene múltiples perfiles. ¿Con cuál deseas ingresar?</p>
                    <select id="profileSelect" style="width:100%; padding:9px 12px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:0.9rem; margin-bottom:16px; background:white;">
                      ${optionsHtml}
                    </select>
                    <button id="profileConfirmBtn" style="width:100%; padding:10px; background:#1976d2; color:white; border:none; border-radius:8px; font-size:0.9rem; font-weight:600; cursor:pointer;">
                      Ingresar
                    </button>
                  </div>`;
                document.getElementById('profileConfirmBtn').addEventListener('click', function() {
                  const idx = document.getElementById('profileSelect').value;
                  google.script.run.withSuccessHandler(function() {
                    onUserValidated(matchedUsers[idx]);
                    document.getElementById('loader').style.display = 'none';
                    updateGoButtonState();
                    startBackgroundStaticPreload();
                  }).saveUserProfileSelection(idx);
                });
                // Salimos aquí para que el loader espere a la confirmación
                return;
              }
            } else {
               // Bloquear UI
               document.body.innerHTML = `
                 <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Inter', sans-serif; background-color: #f8fafc; padding: 20px; text-align: center;">
                   <div style="width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 50%; background: #fef2f2; border: 1px solid #fecaca; display: flex; align-items: center; justify-content: center; color: #dc2626;">
                     <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                       <circle cx="12" cy="12" r="10"/>
                       <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                     </svg>
                   </div>
                   <h2 style="color: #0f172a; margin: 0 0 12px 0;">Acceso Denegado</h2>
                   <p style="color: #475569; margin: 0 0 24px 0; max-width: 400px; line-height: 1.5;">El correo <strong>${myEmail || 'Desconocido'}</strong> no tiene un usuario asignado en el sistema.</p>
                   <div style="background: #e2e8f0; padding: 16px; border-radius: 8px; color: #334155; font-size: 0.9em; border-left: 4px solid #94a3b8;">
                     Por favor, solicita al administrador que cree tu usuario en la hoja de <strong>Usuarios</strong>.
                   </div>
                 </div>
               `;
               return;
            }

          } catch (e) {
            document.getElementById('loader').innerHTML = `<span class="error-text">Error interno al cargar: ${e.message}</span>`;
            console.error(e);
          }
        }).withFailureHandler(e => {
          document.getElementById('loader').innerHTML = `<span class="error-text">Error al cargar: ${e.message}</span>`;
        }).getInitialData(SPREADSHEET_ID);
      };

      // PDF generation processing function (extracted for reuse)
      async function processPdfGeneration(payload, config, orderNo, userName, userId, printType, btn, status) {
        try {
          setStatusMessage('loading', 'Paso 2/4: Preparando motor PDF...');

          // Merge dynamic templates from payload with preloaded static templates.
          // Respetamos el orden y las copias de config. Usamos un for-of para poder
          // await la descarga on-demand de una estática que aún no esté en memoria.
          const finalPdfs = [];
          // Clasificación según la columna 'Type' de la hoja templates:
          //   Type === 'Estatica' -> plantilla estática (un PDF fijo por fileId).
          //   Type === 'Dinamica' -> DOC_ORDENES/DOC_ANALISIS son dinámicas (se buscan
          //                        por No. de orden/análisis y vienen en el payload);
          //                        DOC_COMPLETO es solo carpeta destino y se omite.
          for (const cfg of config) {
            const templateMeta = globalTemplates.find(t => t.key === cfg.key);
            const isStatic = templateMeta && isStaticTemplate(templateMeta);

            if (cfg.key === 'DOC_COMPLETO') {
              // DOC_COMPLETO es solo carpeta de destino, no plantilla - omitir
              console.log(`✓ Omitiendo DOC_COMPLETO (carpeta de destino)`);
              continue;
            }

            if (isStatic) {
              // Estática: usar la precargada en background si coincide el fileId, o descargarla on-demand.
              let cached = preloadedStaticPdfs[cfg.key];
              let base64 = null;
              if (cached) {
                if (typeof cached === 'string') {
                  base64 = cached;
                } else if (cached.fileId === cfg.fileId) {
                  base64 = cached.base64;
                } else {
                  console.log(`⚠️ Plantilla ${cfg.key} en memoria tenía fileId '${cached.fileId}' pero se requiere '${cfg.fileId}'. Se descargará la versión actualizada.`);
                }
              }

              if (base64) {
                console.log(`✓ Usando plantilla estática precargada: ${cfg.key}`);
              } else {
                setStatusMessage('loading', `Descargando plantilla: ${templateMeta.name}...`);
                console.log(`⏳ Descargando estática on-demand: ${cfg.key} (ID: ${cfg.fileId})`);
                base64 = await new Promise((resolve, reject) => {
                  google.script.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(reject)
                    .getStaticTemplateBase64(cfg.key, cfg.fileId);
                });
                if (!base64) throw new Error(`No se pudo obtener el PDF de la plantilla ${templateMeta.name} (${cfg.key}).`);
                preloadedStaticPdfs[cfg.key] = { base64: base64, fileId: cfg.fileId };
              }
              finalPdfs.push({ key: cfg.key, base64: base64, copies: cfg.copies });
            } else {
              // Dinámica: usar la del payload (DOC_ORDENES / DOC_ANALISIS).
              const dynamicPdf = payload.pdfs.find(p => p.key === cfg.key);
              if (dynamicPdf) {
                finalPdfs.push({ key: cfg.key, base64: dynamicPdf.base64, copies: cfg.copies });
                console.log(`✓ Usando plantilla dinámica del servidor: ${cfg.key}`);
              } else {
                throw new Error(`Falta el archivo para ${cfg.key}. Verifique que el PDF de la orden exista en la carpeta de Drive o que la orden tenga asignado un NoAnalisis válido.`);
              }
            }
          }

          // Replace payload.pdfs with the merged array
          payload.pdfs = finalPdfs;

          const { PDFDocument, rgb, degrees } = PDFLib;
          const finalPdf = await PDFDocument.create();
          
          // Configurar documento para máxima compatibilidad con impresoras
          finalPdf.setTitle('');
          finalPdf.setAuthor('');
          finalPdf.setSubject('');
          finalPdf.setKeywords([]);
          finalPdf.setProducer('');
          finalPdf.setCreator('Sistema QMS');
          
          let totalPages = 0;

          const now = new Date();
          const formattedDate = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

          let templatesPrintedInfo = [];

          for (const item of payload.pdfs) {
            setStatusMessage('loading', `Paso 3/4: Procesando ${item.key}...`);
            let pagesForThisTemplate = 0;

            const bytes = Uint8Array.from(atob(item.base64), c => c.charCodeAt(0));
            for (let i = 0; i < item.copies; i++) {
              // Cargar PDF sin preservar objetos innecesarios
              const doc = await PDFDocument.load(bytes, { 
                ignoreEncryption: true,
                updateMetadata: false 
              });
              const pages = doc.getPages();

              if (item.key === "DOC_ORDENES") {
                const firstPage = pages[0];
                Object.keys(payload.coords).forEach(k => {
                  firstPage.drawText(payload.formData[k] || "", { 
                    x: payload.coords[k].x, 
                    y: payload.coords[k].y, 
                    size: 10, 
                    color: rgb(0,0,0),
                    opacity: 1.0  // Asegurar opacidad completa
                  });
                });
              } else if (item.key !== "DOC_ANALISIS") {
                try {
                  const form = doc.getForm();
                  Object.keys(payload.formData).forEach(k => { 
                    try { 
                      const field = form.getTextField(k);
                      field.setText(payload.formData[k]);
                      field.enableReadOnly();  // Marcar como solo lectura antes de aplanar
                    } catch(e){} 
                  });
                } catch(e) { 
                  console.log(`No hay formularios en ${item.key}`);
                }
              }
              
              // Eliminar metadatos innecesarios del documento fuente
              doc.setTitle('');
              doc.setAuthor('');
              doc.setSubject('');
              doc.setKeywords([]);
              doc.setProducer('');

              const copied = await finalPdf.copyPages(doc, doc.getPageIndices());
              copied.forEach(p => finalPdf.addPage(p));
              totalPages += copied.length;
              pagesForThisTemplate += copied.length;

              // --- AGREGAR PÁGINA EN BLANCO SI ESTA PLANTILLA TIENE NÚMERO IMPAR DE PÁGINAS ---
              console.log(`Plantilla: ${item.key}, Copia: ${i+1}, Páginas: ${copied.length}, Es impar: ${copied.length % 2 !== 0}`);
              if (copied.length % 2 !== 0) {
                const blankPage = finalPdf.addPage([612, 792]);
                const blankText = "Esta página fue dejada en blanco de manera intencional";
                const textWidth = blankText.length * 5.5;
                const pageWidth = blankPage.getWidth();
                const pageHeight = blankPage.getHeight();
                
                blankPage.drawText(blankText, {
                  x: (pageWidth - textWidth) / 2,
                  y: pageHeight / 2,
                  size: 11,
                  color: rgb(0.4, 0.4, 0.4),
                  opacity: 1.0
                });
                totalPages += 1;
                pagesForThisTemplate += 1;
                console.log(`✓ Página en blanco añadida después de ${item.key}`);
              }
            }
            templatesPrintedInfo.push(`${item.key} (${pagesForThisTemplate})`);
          }

          const templatesSummary = templatesPrintedInfo.join(", ");

          // --- INYECCIÓN DE PIE DE PÁGINA (Orientación Dinámica + Espacio Fijo) ---
          const allPages = finalPdf.getPages();

          allPages.forEach((p) => {
            let { width, height } = p.getSize();
            let currentRotation = p.getRotation().angle || 0;

            if (width > height) {
              currentRotation = (currentRotation + 90) % 360;
              p.setRotation(degrees(currentRotation));

              const temp = width;
              width = height;
              height = temp;
            }

            // Extraer solo el nombre si viene con el formato "ID - Nombre"
            const nombreParaPie = userName.includes(" - ") ? userName.split(" - ")[1].trim() : userName;
            const footerLeftText = `Impreso por: ${nombreParaPie} el ${formattedDate}   |   No. Orden: ${orderNo}`;
            const footerRightText = "Pág. ____ de ____";

            const drawVisualText = (text, vX, vY, size) => {
              let normAngle = ((currentRotation % 360) + 360) % 360;
              let mW = (normAngle === 90 || normAngle === 270) ? height : width;
              let mH = (normAngle === 90 || normAngle === 270) ? width : height;

              let lX, lY, tRot;
              if (normAngle === 0) { lX = vX; lY = vY; tRot = 0; }
              else if (normAngle === 90) { lX = mW - vY; lY = vX; tRot = 90; }
              else if (normAngle === 180) { lX = mW - vX; lY = mH - vY; tRot = 180; }
              else if (normAngle === 270) { lX = vY; lY = mH - vX; tRot = 270; }

              p.drawText(text, {
                x: lX, y: lY, size: size,
                rotate: degrees(tRot),
                color: rgb(0,0,0),
                opacity: 1.0
              });
            };

            drawVisualText(footerLeftText, 35, 20, 8);
            drawVisualText(footerRightText, width - 130, 20, 8);
          });

          setStatusMessage('loading', 'Paso 4/4: Optimizando PDF para impresión...');

          // OPTIMIZACIÓN FINAL: Aplanar todos los formularios del documento unificado
          try {
            const finalForm = finalPdf.getForm();
            if (finalForm.getFields().length > 0) {
              console.log(`✓ Aplanando ${finalForm.getFields().length} campos de formulario en documento final`);
              finalForm.flatten();
            }
          } catch(e) {
            console.log('No hay formularios en documento final o ya están aplanados');
          }

          // Purgar el diccionario AcroForm para evitar saturación de memoria en impresoras
          try {
            finalPdf.catalog.delete(PDFLib.PDFName.of('AcroForm'));
            console.log('✓ Diccionario AcroForm purgado del catálogo maestro');
          } catch(e) {
            console.log('No se pudo purgar AcroForm:', e);
          }

          console.time('pdf-save');
          console.log('✓ Guardando PDF con configuración optimizada para impresión');
          const pdfData = await finalPdf.save({
            useObjectStreams: true,         // Activa compresión de objetos (FlateDecode)
            addDefaultPage: false,          // No agregar páginas adicionales
            objectsPerTick: 50,             // Procesar objetos en lotes pequeños
            updateFieldAppearances: false   // No actualizar apariencias (ya están aplanadas)
          });
          console.timeEnd('pdf-save');
          console.log(`✓ PDF generado: ${(pdfData.length / 1024 / 1024).toFixed(2)} MB, ${totalPages} páginas`);
          
          console.time('base64-conversion');
          const base64Data = uint8ArrayToBase64(new Uint8Array(pdfData));
          console.timeEnd('base64-conversion');

          const blobURL = URL.createObjectURL(new Blob([pdfData], { type: 'application/pdf' }));
          
          setStatusMessage('success', "PDF listo en memoria. Haga clic en 'Ver PDF Generado' para abrirlo.");
          
          // Ocultar botón original y mostrar el botón-enlace "Ver PDF Generado"
          btn.style.display = 'none';
          
          let downloadLink = document.getElementById('pdfDownloadLink');
          if (!downloadLink) {
            downloadLink = document.createElement('a');
            downloadLink.id = 'pdfDownloadLink';
            downloadLink.setAttribute('role', 'button');
            btn.parentNode.insertBefore(downloadLink, btn.nextSibling);
          }
          downloadLink.href = blobURL;
          downloadLink.target = '_blank';
          downloadLink.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
            'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>' +
            '<polyline points="14 2 14 8 20 8"></polyline>' +
            '<line x1="12" y1="18" x2="12" y2="12"></line>' +
            '<polyline points="9 15 12 18 15 15"></polyline>' +
            '</svg><span>Ver PDF Generado</span>';
          downloadLink.style.display = 'flex';

          downloadLink.onclick = function() {
            // 1) Disparar SIEMPRE el guardado en Drive + actualización de trazabilidad.
            google.script.run
              .processAndSavePdfBackgroundForUser(base64Data, orderNo, userId, totalPages, printType, templatesSummary);

            // 2) Liberar la UI para la siguiente orden, retrasado ligeramente 
            // para no interferir con la apertura nativa de la pestaña
            setTimeout(() => {
              downloadLink.style.display = 'none';
              btn.style.display = 'inline-block';
              
              document.getElementById('orderNo').value = '';
              resetPreloadState();
              setPreloadBanner('', '');
              document.getElementById('orderNo').focus();

              btn.innerText = "Generar PDF Combinado";
              btn.onclick = run;
              updateGoButtonState();

              setStatusMessage('loading', 'Guardando PDF en segundo plano...');
              setTimeout(() => {
                clearStatus();
              }, 3000);
            }, 50);
          };

        } catch (pdfError) {
          alert("Error generando PDF: " + pdfError.message);
          setStatusMessage('error', 'Error: ' + pdfError.message);
          btn.innerText = "Generar PDF Combinado";
          btn.onclick = run;
          btn.disabled = false;
        }
      }

      function buildConfigFromUI() {
        const config = [];
        globalTemplates.forEach(t => {
          let copies = 0;
          if (isActiveTemplate(t)) {
             const input = document.getElementById('val_' + t.key);
             copies = input ? (parseInt(input.value) || 0) : 0;
          }
          if (copies > 0) {
            config.push({
              key: t.key,
              fileId: t.fileId,
              hasAccess: t.hasAccess,
              copies: copies
            });
          }
        });
        return config;
      }

      async function run() {
        const config = buildConfigFromUI();
        const orderNo = document.getElementById('orderNo').value.trim();
        
        let userId = "";
        let userName = "";
        
        if (window.currentUserIdentity) {
          userId = window.currentUserIdentity.split(' - ')[0];
          userName = window.currentUserIdentity;
        } else {
          // Fallback if not validated via logic flow
          alert("Error: Usuario no validado. Por favor recargue la página.");
          return;
        }

        const printType = document.querySelector('input[name="printType"]:checked').value;
        const btn = document.getElementById('goBtn');
        const status = document.getElementById('status');

        status.className = "";

        if (!orderNo) { alert("Error: Complete el campo No. de Orden."); return; }

        // Verificar si hay plantillas sin acceso seleccionadas
        const noAccessSelected = config.filter(c => c.hasAccess === false);
        if (noAccessSelected.length > 0) {
          const names = noAccessSelected.map(c => globalTemplates.find(t => t.key === c.key).name).join('\n- ');
          alert("Error: Las siguientes plantillas no tienen acceso:\n\n- " + names + "\n\nPor favor, use el menú 'Diagnosticar Plantillas' para resolver este problema.");
          return;
        }


        if (config.length === 0) { alert("Error: Seleccione al menos 1 copia de alguna plantilla."); return; }
        
        if (preloadState.data && preloadState.data.warnings && preloadState.data.warnings.length > 0) {
          const warningMessages = preloadState.data.warnings.map(w => w.message).join('\n');
          
          document.getElementById('customConfirmMessage').innerText = warningMessages;
          const modal = document.getElementById('customConfirmModal');
          modal.style.display = 'flex';
          
          document.getElementById('customConfirmCancel').onclick = function() {
            modal.style.display = 'none';
          };
          
          document.getElementById('customConfirmOk').onclick = function() {
            modal.style.display = 'none';
            continueWithPrint(orderNo, config, btn, status, userName, userId, printType);
          };
          return;
        }

        continueWithPrint(orderNo, config, btn, status, userName, userId, printType);
      }
      
      function continueWithPrint(orderNo, config, btn, status, userName, userId, printType) {
        if (preloadState.status === 'loading' && preloadState.orderNo === orderNo) {
          setPreloadBanner('info', 'Aún se están preparando los documentos. Espere a que aparezca "Documentos listos para impresión".');
          setStatusMessage('loading', 'Esperando documentos dinámicos...');
          return;
        }

        if (!isPreloadReadyForOrder(orderNo)) {
          const messages = (preloadState.orderNo === orderNo && preloadState.errors.length)
            ? preloadState.errors.map(err => err.message).join('<br>')
            : 'Ingrese un No. de Orden válido y espere a que DOC_ORDENES y DOC_ANALISIS estén listos.';
          setPreloadBanner('error', messages);
          setStatusMessage('error', 'Proceso bloqueado: faltan documentos requeridos.');
          return;
        }

        btn.disabled = true;

        setStatusMessage('loading', 'Paso 2/4: Preparando motor PDF (datos precargados)...');
        console.log(`✓ Usando documentos dinámicos precargados para orden ${orderNo}`);
        const payload = buildPayloadFromPreload(config);
        processPdfGeneration(payload, config, orderNo, userName, userId, printType, btn, status);
      }

      // --- Inicializar sistema de drag y resize ---
      initializeModalDragResize({
        title: 'Panel de Impresión',  // No se mostrará - drag handle oculto
        enableDrag: true,
        enableResize: true,
        minWidth: 400,
        minHeight: 500,
        maxWidth: 1200,
        maxHeight: 1000
      });

      // Resize dynamically to 80% of available screen height for better UX on large screens
      try {
        const targetHeight = Math.min(Math.max(window.screen.availHeight * 0.8, 600), 1000);
        google.script.host.setHeight(Math.round(targetHeight));
      } catch (e) {
        console.log("Could not auto-resize height:", e);
      }
    </script>
