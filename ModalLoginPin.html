  <style>

<body>
  <div class="lp-container">
    <h3 id="lp-title">Iniciando Sesión</h3>
    <p id="lp-subtitle">Verificando identidad...</p>
    <div id="lp-body"></div>
    <div class="lp-actions">
      <button type="button" class="btn btn-secondary cancel-btn" id="lp-cancel-btn">Cancelar</button>
    </div>
  </div>

  <!-- Data island: el HtmlService inyecta el JSON aquí en evaluate(). Se usa un
       script de tipo application/json en vez de imprimir el scriptlet de
       plantilla directo dentro del bloque de JavaScript de abajo, para que
       tanto ESLint como el propio compilador de plantillas de Apps Script
       (que escanea todo el archivo en busca de delimitadores de scriptlet,
       incluso dentro de comentarios) no tropiecen con él. -->
  <script type="application/json" id="lp-identidad-data"><?!= identidad ?></script>

  <script>
    var identidad = JSON.parse(document.getElementById('lp-identidad-data').textContent);
    var webAppUrl = identidad.webAppUrl || '';

    // Precalentar en segundo plano el caché de getInitialData() (hojas 'Usuarios'
    // y 'templates') MIENTRAS el usuario ve el saludo y escribe su PIN — así,
    // cuando la validación resulte exitosa y se abra el Sidebar (abrirSidebarQMS
    // en SidebarLogic.gs), este ya encuentra ese caché caliente y abre casi de
    // inmediato en vez de tener que leer las hojas desde cero en ese momento.
    // Es solo una precarga silenciosa: nunca muestra nada ni afecta el gate de
    // PIN, que sigue siendo la única puerta de entrada al panel.
    google.script.run.getInitialData(false);

    document.getElementById('lp-cancel-btn').addEventListener('click', function () {
      google.script.host.close();
    });

    function setTitle(text, color) {
      var el = document.getElementById('lp-title');
      el.textContent = text;
      el.style.color = color || '#0f172a';
    }

    function setSubtitle(text) {
      document.getElementById('lp-subtitle').textContent = text;
    }

    function setBody(html) {
      document.getElementById('lp-body').innerHTML = html;
    }

    function nombreDe(candidato) {
      return candidato.nombreCompleto || candidato.nombreCorto || candidato.userId;
    }

    function esRolAdmin_(rol) {
      var u = (rol || '').toString().toUpperCase();
      return u === 'ADMIN' || u === 'ADMINISTRADOR' || u === 'ADMINISTRADOR DE SISTEMA';
    }

    // === PASO 1: identidad ===
    function init() {
      if (identidad.status === 'none') {
        setTitle('Acceso Denegado', '#dc2626');
        setSubtitle('Usuario no registrado.');
        setBody('<p style="color:#dc2626; font-size:13px; background:#fef2f2; padding:12px; border-radius:8px; border:1px solid #f87171;">El correo de su sesión de Google (<b>' +
          escapeHtml(identidad.activeEmail || '') + '</b>) no tiene permisos de acceso al sistema. Por favor, contacte al administrador.</p>');
        return;
      }
      if (identidad.status === 'multiple') {
        renderSelectorUsuario(identidad.candidates);
        return;
      }
      seleccionarUsuario(identidad.candidates[0]);
    }

    function renderSelectorUsuario(candidatos) {
      setTitle('Múltiples Usuarios');
      setSubtitle('Su correo está asociado a varios usuarios. Seleccione con cuál desea ingresar:');
      var html = '<div class="lp-user-list">';
      candidatos.forEach(function (c, idx) {
        html += '<button type="button" class="lp-user-option" data-idx="' + idx + '">' +
          '<span class="lp-user-name">' + escapeHtml(nombreDe(c)) + '</span>' +
          '<span class="lp-user-role">' + escapeHtml(c.rol || '') + '</span>' +
          '</button>';
      });
      html += '</div>';
      setBody(html);
      document.querySelectorAll('.lp-user-option').forEach(function (btn) {
        btn.addEventListener('click', function () {
          seleccionarUsuario(candidatos[parseInt(btn.dataset.idx, 10)]);
        });
      });
    }

    // === PASO 2: saludo + gate de PIN para el usuario elegido ===
    function seleccionarUsuario(candidato) {
      var nombre = nombreDe(candidato);

      if (candidato.estado === 'Bloqueado') {
        setTitle('Usuario Bloqueado', '#dc2626');
        setSubtitle('Acceso restringido para ' + nombre + '.');
        setBody('<p style="color:#dc2626; font-size:13px; background:#fef2f2; padding:12px; border-radius:8px; border:1px solid #f87171;">⛔ Su usuario ha sido bloqueado por superar el límite de intentos fallidos de firma. Contacte al administrador.</p>');
        return;
      }

      if (candidato.estado === 'Pendiente') {
        setTitle('Acceso Pendiente', '#d97706');
        setSubtitle('Hola, ' + nombre + '.');
        setBody('<p style="color:#d97706; font-size:13px; background:#fffbeb; padding:12px; border-radius:8px; border:1px solid #fcd34d;">⏳ Su solicitud de acceso aún está pendiente de aprobación por el administrador.</p>');
        return;
      }

      if (!candidato.rol) {
        setTitle('Falta Configuración', '#d97706');
        setSubtitle('Hola, ' + nombre + '.');
        setBody('<p style="color:#d97706; font-size:13px; background:#fffbeb; padding:12px; border-radius:8px; border:1px solid #fcd34d;">Su usuario no tiene un rol asignado. Contacte al administrador antes de continuar.</p>');
        return;
      }

      if (!isPinConfiguredClient_(candidato.pin)) {
        iniciarCreacionPin(nombre, candidato);
      } else {
        setTitle('Verificación de Identidad');
        setSubtitle('Hola, ' + nombre + '. Ingrese su PIN de seguridad para continuar:');
        renderPinInputs(function (pin, inputs) {
          validarPin(pin, inputs, candidato);
        });
        if (esRolAdmin_(candidato.rol)) {
          renderAdminOverrideLink(candidato);
        }
      }
    }

    // === Recuperación exclusiva ADMIN: clave de administrador en vez del PIN ===
    function renderAdminOverrideLink(candidato) {
      var link = document.createElement('button');
      link.type = 'button';
      link.className = 'lp-admin-override-link';
      link.textContent = '¿Olvidó su PIN? Usar clave de administrador';
      link.addEventListener('click', function () {
        renderAdminOverrideForm(candidato);
      });
      document.querySelector('.lp-container').insertBefore(link, document.querySelector('.lp-actions'));
    }

    function renderAdminOverrideForm(candidato) {
      setTitle('Clave de Administrador', '#9333ea');
      setSubtitle('Ingrese la clave maestra para omitir la validación del PIN.');
      document.querySelectorAll('.lp-admin-override-link, .lp-admin-override-form').forEach(function (el) { el.remove(); });

      var form = document.createElement('div');
      form.className = 'lp-admin-override-form';
      form.innerHTML =
        '<input type="password" class="lp-admin-override-input" placeholder="Clave maestra de sistema">' +
        '<button type="button" class="btn btn-secondary lp-admin-override-submit">Validar</button>' +
        '<div class="lp-error" id="lp-override-error"></div>';
      document.querySelector('.lp-container').insertBefore(form, document.querySelector('.lp-actions'));

      var input = form.querySelector('.lp-admin-override-input');
      var submitBtn = form.querySelector('.lp-admin-override-submit');

      function submitOverride() {
        var clave = input.value;
        if (!clave) return;
        validarClaveAdmin(clave, input, submitBtn, candidato);
      }

      submitBtn.addEventListener('click', submitOverride);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submitOverride();
      });
      input.focus();
    }

    function validarClaveAdmin(clave, input, submitBtn, candidato) {
      input.disabled = true;
      submitBtn.disabled = true;
      var errEl = document.getElementById('lp-override-error');
      if (errEl) errEl.textContent = 'Validando...';

      fetch(webAppUrl, {
        method: 'POST',
        body: JSON.stringify({ operation: 'validarAccesoSesion', userId: candidato.userId, pinFirma: '__ADMIN_OVERRIDE__:' + clave })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.status === 'success') {
            finalizarLogin(candidato.userId);
            return;
          }
          if (errEl) errEl.textContent = data.message || 'Clave de administrador incorrecta.';
          input.disabled = false;
          submitBtn.disabled = false;
          input.value = '';
          input.focus();
        })
        .catch(function (err) {
          if (errEl) errEl.textContent = 'Error de conexión: ' + (err && err.message ? err.message : err);
          input.disabled = false;
          submitBtn.disabled = false;
        });
    }

    // === Entrada de PIN de 4 dígitos (reutilizable para crear y validar) ===
    function renderPinInputs(onComplete) {
      setBody(
        '<div class="pin-inputs-container">' +
        '<input type="password" class="modern-pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">' +
        '<input type="password" class="modern-pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">' +
        '<input type="password" class="modern-pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">' +
        '<input type="password" class="modern-pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">' +
        '</div>' +
        '<div class="lp-error" id="lp-error"></div>'
      );

      var inputs = document.querySelectorAll('.modern-pin-input');
      function currentValue() { return Array.prototype.map.call(inputs, function (i) { return i.value; }).join(''); }

      inputs.forEach(function (input, index) {
        input.addEventListener('input', function () {
          input.value = input.value.replace(/[^0-9]/g, '');
          if (input.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
          if (currentValue().length === 4) setTimeout(function () { onComplete(currentValue(), inputs); }, 100);
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' && input.value === '' && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
          }
        });

        input.addEventListener('paste', function (e) {
          e.preventDefault();
          var pasted = (e.clipboardData || window.clipboardData).getData('text');
          var digits = pasted.replace(/[^0-9]/g, '').substring(0, 4);
          if (digits.length === 0) return;
          for (var i = 0; i < digits.length; i++) {
            if (index + i < inputs.length) inputs[index + i].value = digits[i];
          }
          inputs[Math.min(index + digits.length - 1, inputs.length - 1)].focus();
          if (currentValue().length === 4) setTimeout(function () { onComplete(currentValue(), inputs); }, 100);
        });
      });

      setTimeout(function () { inputs[0].focus(); }, 50);
      return inputs;
    }

    function clearPinInputs(inputs) {
      inputs.forEach(function (i) { i.value = ''; i.disabled = false; });
      inputs[0].focus();
    }

    function setPinInputsDisabled(inputs, disabled) {
      inputs.forEach(function (i) { i.disabled = disabled; });
    }

    function showPinError(msg) {
      var el = document.getElementById('lp-error');
      if (el) el.textContent = msg || '';
    }

    // === Validar PIN existente ===
    function validarPin(pin, inputs, candidato) {
      setPinInputsDisabled(inputs, true);
      showPinError('Validando...');

      fetch(webAppUrl, {
        method: 'POST',
        body: JSON.stringify({ operation: 'validarAccesoSesion', userId: candidato.userId, pinFirma: pin })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.status === 'success') {
            finalizarLogin(candidato.userId);
            return;
          }
          if (data.message && data.message.indexOf('bloqueado') !== -1) {
            setBody('<p style="color:#dc2626; font-size:13px;">⛔ ' + escapeHtml(data.message) + '</p>');
            return;
          }
          showPinError(data.message || 'PIN incorrecto.');
          clearPinInputs(inputs);
        })
        .catch(function (err) {
          showPinError('Error de conexión: ' + (err && err.message ? err.message : err));
          clearPinInputs(inputs);
        });
    }

    // === Creación de PIN en dos pasos (usuario sin PIN configurado) ===
    function iniciarCreacionPin(nombre, candidato) {
      setTitle('Crear Firma Electrónica', '#2563eb');
      setSubtitle('Hola, ' + nombre + '. Necesita configurar su PIN (4 dígitos) por primera vez:');
      renderPinInputs(function (pin1, inputs1) {
        setPinInputsDisabled(inputs1, true);
        setTitle('Confirmar Firma Electrónica', '#2563eb');
        setSubtitle('Vuelva a ingresar el PIN para confirmar:');
        renderPinInputs(function (pin2, inputs2) {
          if (pin1 !== pin2) {
            showPinError('Los PIN ingresados no coinciden. Intente nuevamente.');
            iniciarCreacionPin(nombre, candidato);
            return;
          }
          confirmarNuevoPin(pin1, inputs2, nombre, candidato);
        });
      });
    }

    function confirmarNuevoPin(pin, inputs, nombre, candidato) {
      setPinInputsDisabled(inputs, true);
      showPinError('Configurando PIN...');

      fetch(webAppUrl, {
        method: 'POST',
        body: JSON.stringify({ operation: 'configurarNuevoPin', userId: candidato.userId, nuevoPin: pin })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.status === 'success') {
            finalizarLogin(candidato.userId);
            return;
          }
          showPinError(data.message || 'No se pudo configurar el PIN.');
          iniciarCreacionPin(nombre, candidato);
        })
        .catch(function (err) {
          showPinError('Error de conexión: ' + (err && err.message ? err.message : err));
          iniciarCreacionPin(nombre, candidato);
        });
    }

    // === Éxito: abrir el Sidebar QMS ya autenticado y cerrar este modal ===
    function finalizarLogin(userId) {
      setTitle('¡Bienvenido!', '#166534');
      setSubtitle('Su identidad ha sido verificada correctamente.');
      setBody('<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 0;"><div style="width:48px; height:48px; border-radius:50%; background:#dcfce7; color:#166534; display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:12px;">✅</div><p style="color:#166534; font-size:13px; font-weight:500;">Iniciando el sistema QMS...</p></div>');
      document.getElementById('lp-cancel-btn').disabled = true;

      google.script.run
        .withSuccessHandler(function () { google.script.host.close(); })
        .withFailureHandler(function (err) {
          setSubtitle('Error al abrir el panel: ' + (err && err.message ? err.message : err));
          document.getElementById('lp-cancel-btn').disabled = false;
        })
        .completarLoginYAbrirPanel(userId);
    }

    init();
  </script>
</body>
