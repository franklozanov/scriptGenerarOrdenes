<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autorizar Órdenes (QA)</title>
  
  <!-- FASE 6: Design System Centralizado -->
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  
  <!-- Scripts Globales -->
  <?!= HtmlService.createHtmlOutputFromFile('GlobalScripts').getContent(); ?>
  
  <style>
    /* Estilos específicos de este modal */
    .table-container {
      margin-top: 20px;
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    
    th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
    }
    
    tr:hover {
      background-color: #f1f5f9;
    }
    
    .checkbox-cell {
      width: 50px;
      text-align: center;
    }
    
    .estado-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .estado-cargados {
      background-color: #dcfce7;
      color: #166534;
    }
    
    .estado-pendiente {
      background-color: #fef9c3;
      color: #854d0e;
    }
    
    .no-orders {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    
    .authorization-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }
    
    .form-row {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #334155;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer" style="display: none;">
    <div class="info">
      Seleccione las órdenes que desea autorizar. Solo se pueden autorizar órdenes con STATUS "Solicitada" y documentos completamente cargados.
    </div>
    
    <div class="table-container">
      <table id="ordenesTable">
        <thead>
          <tr>
            <th class="checkbox-cell">
              <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
            </th>
            <th>No. Orden</th>
            <th>Código</th>
            <th>Lote</th>
            <th>Estado Documentos</th>
          </tr>
        </thead>
        <tbody id="ordenesTableBody">
          <!-- Las filas se generarán dinámicamente -->
        </tbody>
      </table>
      <div id="noOrdersMessage" class="no-orders" style="display: none;">
        No hay órdenes pendientes de aprobación.
      </div>
    </div>
    
    <div class="authorization-section">
      <div class="form-row">
        <div class="form-group">
          <label for="pinFirma">PIN de Autorización (Firma Electrónica) *</label>
          <div class="password-input-wrapper">
            <input type="password" id="pinFirma" placeholder="Ingrese su PIN de autorización" maxlength="20">
            <button type="button" id="togglePinFirma" class="password-toggle-btn" aria-label="Mostrar contraseña" title="Mostrar contraseña" onclick="togglePasswordVisibility('pinFirma', 'togglePinFirma')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
      </div>
      
      <button id="btnAutorizar" class="btn btn-primary" onclick="autorizarOrdenes()">
        ✅ Firmar y Autorizar Seleccionadas
      </button>
    </div>
  </div>
  
  <!-- Loading Overlay -->
  <div id="loading-overlay" class="hidden">
    <div class="loading-spinner"></div>
    <div id="loading-text">Procesando...</div>
  </div>
  
  <script>
    var globalWebAppUrl = '';
    var ordenesData = [];
    
    window.onload = function() {
      // Inicializar drag y resize
      initializeModalDragResize({
        title: 'Autorización de Órdenes (QA)',
        enableDrag: true,
        enableResize: true,
        minWidth: 800,
        minHeight: 600,
        maxWidth: 1200,
        maxHeight: 900
      });
      
      // Obtener datos iniciales
      showLoading('Cargando datos...');
      google.script.run
        .withSuccessHandler(function(data) {
          if (data && data.webAppUrl) {
            globalWebAppUrl = data.webAppUrl;
          }
          setFrontendPermissions(data.userPermissions);
          loadOrdenesSolicitadas();
        })
        .withFailureHandler(function(error) {
          hideLoading();
          showError('Error al cargar datos iniciales: ' + error.message);
          document.getElementById('mainContainer').style.display = 'block';
        })
        .getInitialData();
    };
    
    function loadOrdenesSolicitadas() {
      google.script.run
        .withSuccessHandler(function(ordenes) {
          ordenesData = ordenes;
          hideLoading();
          document.getElementById('mainContainer').style.display = 'block';
          renderTable(ordenes);
        })
        .withFailureHandler(function(error) {
          hideLoading();
          showError('Error al cargar órdenes: ' + error.message);
          document.getElementById('mainContainer').style.display = 'block';
        })
        .getOrdenesSolicitadasParaQA();
    }
    
    function renderTable(ordenes) {
      var tbody = document.getElementById('ordenesTableBody');
      var noOrdersMsg = document.getElementById('noOrdersMessage');
      var table = document.getElementById('ordenesTable');
      
      tbody.innerHTML = '';
      
      if (!ordenes || ordenes.length === 0) {
        table.style.display = 'none';
        noOrdersMsg.style.display = 'block';
        return;
      }
      
      table.style.display = 'table';
      noOrdersMsg.style.display = 'none';
      
      ordenes.forEach(function(orden, index) {
        var row = document.createElement('tr');
        
        // Determinar si el checkbox debe estar deshabilitado
        var estadoCarga = orden.estadoCarga || '';
        var isPendiente = (
          estadoCarga === 'Pendiente COA/OA' ||
          estadoCarga === 'Pendiente OA' ||
          estadoCarga === 'Pendiente COA' ||
          estadoCarga === 'Pendiente Ambos'
        );
        
        // Clase para el badge de estado
        var estadoClass = (estadoCarga === 'Cargados' || estadoCarga === '✅ Cargados') ? 'estado-cargados' : 'estado-pendiente';
        var estadoDisplay = estadoCarga || 'Desconocido';
        
        row.innerHTML = `
          <td class="checkbox-cell">
            <input type="checkbox" class="orden-checkbox" data-noorden="${orden.noOrden}" ${isPendiente ? 'disabled' : ''}>
          </td>
          <td>${orden.noOrden}</td>
          <td>${orden.codigo}</td>
          <td>${orden.descripcion || orden.lote}</td>
          <td><span class="estado-badge ${estadoClass}">${estadoDisplay}</span></td>
        `;
        
        tbody.appendChild(row);
      });
    }
    
    function toggleSelectAll() {
      var selectAll = document.getElementById('selectAll');
      var checkboxes = document.querySelectorAll('.orden-checkbox:not(:disabled)');
      
      checkboxes.forEach(function(checkbox) {
        checkbox.checked = selectAll.checked;
      });
    }
    
    function getSelectedOrdenes() {
      var checkboxes = document.querySelectorAll('.orden-checkbox:checked');
      var selectedIds = [];
      
      checkboxes.forEach(function(checkbox) {
        selectedIds.push(checkbox.getAttribute('data-noorden'));
      });
      
      return selectedIds;
    }
    
    function autorizarOrdenes() {
      var selectedIds = getSelectedOrdenes();
      var pinFirma = document.getElementById('pinFirma').value.trim();
      
      // Validaciones
      if (selectedIds.length === 0) {
        showAlert('Debe seleccionar al menos una orden para autorizar.', 'warning');
        return;
      }
      
      if (!pinFirma) {
        showAlert('Debe ingresar el PIN de autorización.', 'warning');
        return;
      }
      
      // Enviar solicitud
      showLoading('Autorizando órdenes...');
      
      fetch(globalWebAppUrl, {
        method: 'POST',
        body: JSON.stringify({
          operation: 'autorizarOrdenesQA',
          targetIds: selectedIds,
          pinFirma: pinFirma
        })
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {
        hideLoading();
        
        if (data.status === 'success') {
          showAlert(data.message || 'Órdenes autorizadas exitosamente.', 'success');
          document.getElementById('pinFirma').value = '';
          loadOrdenesSolicitadas(); // Recargar tabla
        } else {
          showAlert(data.message || 'Error al autorizar órdenes.', 'error');
        }
      })
      .catch(function(error) {
        hideLoading();
        showError('Error de comunicación: ' + error.message);
      });
    }
  </script>
</body>
</html>
