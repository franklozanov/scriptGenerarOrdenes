<html>
<head>
  <base target="_top">

  <style>
    /* Estilos específicos de este modal */
    .table-container {
      margin-top: 20px;
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
    }
    
    th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
    }
    
    tr:hover {
      background-color: #f1f5f9;
    }
    
    .checkbox-cell {
      width: 50px;
      text-align: center;
    }
    
    .tipo-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;

    }
    
    .tipo-reimpresion {
      background-color: #fef3c7;
      color: #92400e;

    .tipo-adicional {
      background-color: #dbeafe;

    }
    
    .no-requests {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    
    .authorization-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }
    
    .form-row {
      margin-bottom: 15px;

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    
    .action-buttons button {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer" style="display: none;">
    <div class="info">
      Seleccione las solicitudes de impresión extraordinaria que desea aprobar o rechazar. Solo se pueden procesar solicitudes con estado "Pendiente QA".
    </div>
    
    <div class="table-container">
      <table id="solicitudesTable">
        <thead>
          <tr>
            <th class="checkbox-cell">
              <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
            </th>
            <th>ID Solicitud</th>
            <th>No. Orden</th>
            <th>Tipo</th>
            <th>Solicitado Por</th>
            <th>Motivo</th>
            <th>Plantillas</th>
          </tr>
        </thead>
        <tbody id="solicitudesTableBody">
          <!-- Las filas se generarán dinámicamente -->
        </tbody>
      </table>
      <div id="noRequestsMessage" class="no-requests" style="display: none;">
        No hay solicitudes pendientes de aprobación.
      </div>
    </div>
    
    <div class="authorization-section">
      <div class="action-buttons">
        <button id="btnAprobar" class="btn btn-primary" onclick="procesarAprobacion('Aprobada')">
          ✅ Aprobar Seleccionadas
        </button>
        <button id="btnRechazar" class="btn btn-danger" onclick="procesarAprobacion('Rechazada')">
          ❌ Rechazar Seleccionadas
        </button>
      </div>
    </div>
  </div>
  
  <!-- Loading Overlay -->
  <div id="loading-overlay" class="hidden">
    <div class="loading-spinner"></div>
    <div id="loading-text">Procesando...</div>
  </div>
  
  <script>
    let solicitudesData = [];
    var currentUserId = '';
    
    window.onload = function() {
      // Inicializar drag y resize
      initializeModalDragResize({
        title: 'Aprobar Impresiones Extraordinarias',
        enableDrag: true,
        enableResize: true,
        minWidth: 900,
        minHeight: 600,
        maxWidth: 1200,
        maxHeight: 900
      });
      
      // Inyección de variables de servidor para carga instantánea
      var serverInitialData = null;
      var serverSolicitudes = null;
      <? try { ?>
        serverInitialData = <?!= typeof initialData !== 'undefined' ? initialData : 'null' ?>;
      <? } catch(e) {} ?>
      <? try { ?>
        serverSolicitudes = <?!= typeof solicitudesPendientes !== 'undefined' ? solicitudesPendientes : 'null' ?>;
      <? } catch(e) {} ?>
      
      if (serverInitialData && serverSolicitudes) {
        // Carga ultrarrápida (0 segs)
        if (serverInitialData.webAppUrl) {
          window.QMSContext.webAppUrl = serverInitialData.webAppUrl;
        }
        if (serverInitialData.currentUser) {
          currentUserId = serverInitialData.currentUser.userId;
        }
        setFrontendPermissions(serverInitialData.userPermissions);
        solicitudesData = serverSolicitudes;
        document.getElementById('mainContainer').style.display = 'block';
        renderTable(serverSolicitudes);
      } else {
        // Fallback a carga tradicional
        showLoading('Cargando datos...');
        google.script.run
          .withSuccessHandler(function(data) {
            if (data && data.webAppUrl) {
              window.QMSContext.webAppUrl = data.webAppUrl;
            }
            if (data && data.currentUser) {
              currentUserId = data.currentUser.userId;
            }
            setFrontendPermissions(data.userPermissions);
            loadSolicitudesPendientes();
          })
          .withFailureHandler(function(error) {
            hideLoading();
            showError('Error al cargar datos iniciales: ' + error.message);
            document.getElementById('mainContainer').style.display = 'block';
          })
          .getInitialData();
      }
    };
    
    function loadSolicitudesPendientes() {
      google.script.run
        .withSuccessHandler(function(solicitudes) {
          solicitudesData = solicitudes;
          hideLoading();
          document.getElementById('mainContainer').style.display = 'block';
          renderTable(solicitudes);
        })
        .withFailureHandler(function(error) {
          hideLoading();
          showError('Error al cargar solicitudes: ' + error.message);
          document.getElementById('mainContainer').style.display = 'block';
        })
        .getSolicitudesPendientesQA();
    }
    
    function renderTable(solicitudes) {
      var tbody = document.getElementById('solicitudesTableBody');
      var noRequestsMsg = document.getElementById('noRequestsMessage');
      var table = document.getElementById('solicitudesTable');
      
      tbody.innerHTML = '';
      
      if (!solicitudes || solicitudes.length === 0) {
        table.style.display = 'none';
        noRequestsMsg.style.display = 'block';
        return;
      }
      
      table.style.display = 'table';
      noRequestsMsg.style.display = 'none';
      
      solicitudes.forEach(function(solicitud, index) {
        var row = document.createElement('tr');
        
        // Clase para el badge de tipo
        var tipoClass = solicitud.tipoSolicitud === 'Reimpresión' ? 'tipo-reimpresion' : 'tipo-adicional';
        var tipoDisplay = solicitud.tipoSolicitud || 'Desconocido';
        
        // Formatear fecha si existe
        var fechaDisplay = '';
        if (solicitud.fecha) {
          try {
            var fecha = new Date(solicitud.fecha);
            fechaDisplay = fecha.toLocaleDateString('es-ES') + ' ' + fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          } catch(e) {
            fechaDisplay = solicitud.fecha;
          }
        }
        
        row.innerHTML = `
          <td class="checkbox-cell">
            <input type="checkbox" class="solicitud-checkbox" data-idsolicitud="${solicitud.idSolicitud}">
          </td>
          <td><strong>${solicitud.idSolicitud}</strong></td>
          <td>${solicitud.noOrden}</td>
          <td><span class="tipo-badge ${tipoClass}">${tipoDisplay}</span></td>
          <td>${solicitud.solicitadoPor}</td>
          <td>${solicitud.motivo}</td>
          <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${solicitud.plantillas}">${solicitud.plantillas}</td>
        `;
        
        tbody.appendChild(row);
      });
    }
    
    function toggleSelectAll() {
      var selectAll = document.getElementById('selectAll');
      var checkboxes = document.querySelectorAll('.solicitud-checkbox:not(:disabled)');
      
      checkboxes.forEach(function(checkbox) {
        checkbox.checked = selectAll.checked;
      });
    }
    
    function getSelectedSolicitudes() {
      var checkboxes = document.querySelectorAll('.solicitud-checkbox:checked');
      var selectedIds = [];
      
      checkboxes.forEach(function(checkbox) {
        selectedIds.push(checkbox.getAttribute('data-idsolicitud'));
      });
      
      return selectedIds;
    }
    
    async function procesarAprobacion(accion) {
      var selectedIds = getSelectedSolicitudes();
      
      // Validaciones
      if (selectedIds.length === 0) {
        showToast('Debe seleccionar al menos una solicitud para procesar.', 'warning');
        return;
      }
      
      var accionTexto = accion === 'Aprobada' ? 'aprobar' : 'rechazar';
      
      let pinFirma;
      try {
        pinFirma = await promptSecurityPin('Ingrese su PIN para ' + accionTexto + ' las solicitudes seleccionadas:');
      } catch (e) {
        showToast(e.message, 'warning');
        return;
      }
      
      // Enviar solicitud
      showLoading(accion === 'Aprobada' ? 'Aprobando solicitudes...' : 'Rechazando solicitudes...');
      
      google.script.run
        .withSuccessHandler(function(data) {
          hideLoading();
          if (data.status === 'success') {
            showToast(data.message || 'Solicitudes procesadas exitosamente.', 'success');
            document.getElementById('selectAll').checked = false;
            loadSolicitudesPendientes(); // Recargar tabla
          } else {
            showAlert(data.message || 'Error al procesar solicitudes.', 'error');
          }
        })
        .withFailureHandler(function(error) {
          hideLoading();
          showError('Error de comunicación: ' + error.message);
        })
        .procesarAprobacionImpresionQA({
          targetIds: selectedIds,
          accion: accion,
          pinFirma: pinFirma
        }, currentUserId);
    }
  </script>
</body>
</html>
